name: Build and Push OPA Bundle to GHCR

on:
  push:
    branches:
      - main
      - develop
      - deploy-develop
    paths:
      - 'opa/**'
      - '.github/workflows/build-opa-bundle.yaml'
  pull_request:
    branches:
      - main
      - deploy-develop
    paths:
      - 'opa/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eoepca/eoepca-plus/opa-bundle

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OPA
        run: |
          mkdir -p .tools
          cd .tools
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa
          echo "$PWD" >> $GITHUB_PATH

      - name: Setup ORAS
        run: |
          mkdir -p .tools
          cd .tools
          curl -sSLO https://github.com/oras-project/oras/releases/download/v1.1.0/oras_1.1.0_linux_amd64.tar.gz
          tar xzf oras_1.1.0_linux_amd64.tar.gz
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Build OPA bundle
        run: |
          test -d opa/bundle
          opa build -b ./opa/bundle -o ./bundle.tar.gz

      - name: Verify bundle contents
        run: |
          tar -tzf ./bundle.tar.gz | head -20
          echo "Bundle size: $(du -h ./bundle.tar.gz | cut -f1)"

      - name: Create OCI config
        run: |
          cat > config.json <<EOF
          {
            "mediaType": "application/vnd.oci.image.config.v1+json",
            "version": "1.0.0",
            "created": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "description": "OPA Policy Bundle",
            "org.opencontainers.image.source": "${{ github.server_url }}/${{ github.repository }}",
            "org.opencontainers.image.revision": "${{ github.sha }}"
          }
          EOF
          cat config.json

      - name: Extract version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="main"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            TAG="develop"
          elif [[ "${{ github.ref }}" == "refs/heads/deploy-develop" ]]; then
            TAG="deploy-develop"
          else
            TAG="${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push OPA bundle with ORAS
        run: |
          oras push ${{ steps.version.outputs.image }} \
            --config config.json:application/vnd.oci.image.config.v1+json \
            bundle.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
        if: github.event_name != 'pull_request'

      - name: Push latest tag
        run: |
          oras push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --config config.json:application/vnd.oci.image.config.v1+json \
            bundle.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
        if: github.ref == 'refs/heads/deploy-develop' && github.event_name != 'pull_request'

      - name: Summary
        run: |
          echo "## OPA Bundle Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source**: ./opa/bundle (local repository)" >> $GITHUB_STEP_SUMMARY
          echo "**Method**: ORAS push" >> $GITHUB_STEP_SUMMARY
