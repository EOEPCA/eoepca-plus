name: Build and Push slurmd-cwl Image to GHCR

# Builds images/slurmd-cwl (Slinky slurmd with Apptainer and cwltool) and pushes
# it to ghcr.io/eoepca/eoepca-plus/slurmd-cwl. The tag comes from images/slurmd-cwl/VERSION,
# so that argocd/eoepca/slurm/parts/values-slurm.yaml can reference an exact tag.
# A pull request builds the image but does not push it.

on:
  push:
    branches:
      - deploy-develop
    paths:
      - 'images/slurmd-cwl/**'
      - '.github/workflows/build-slurmd-cwl-image.yaml'
  pull_request:
    branches:
      - deploy-develop
    paths:
      - 'images/slurmd-cwl/**'
      - '.github/workflows/build-slurmd-cwl-image.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eoepca/eoepca-plus/slurmd-cwl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=$(tr -d '[:space:]' < images/slurmd-cwl/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/slurmd-cwl
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          echo "## slurmd-cwl image" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pushed**: ${{ github.event_name != 'pull_request' }}" >> "$GITHUB_STEP_SUMMARY"
