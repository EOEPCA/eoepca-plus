# --- PostgreSQL Application ---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-quality-sonarqube-db
  namespace: argocd
  labels:
    eoepca/app-name: application-quality
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: eoepca
  sources:
    - repoURL: https://kubelauncher.github.io/charts
      chart: postgresql
      targetRevision: 0.3.4
      helm:
        releaseName: application-quality-sonarqube
        valueFiles:
          - $values/argocd/eoepca/application-quality/sonarqube/application-quality-sonarqube-db-values.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      # The postgresql chart needs this secret to exist before it can become
      # healthy, but it lives alongside the sonarqube app's own manifests
      # (wave 1). Owning it here directly, ahead of the db pod, avoids a
      # deadlock where wave 1 never runs because wave 0 never turns healthy.
      path: argocd/eoepca/application-quality/sonarqube
      directory:
        include: "ss-application-quality-sonarqube-db-secrets.yaml"
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      ref: values
  destination:
    name: in-cluster
    namespace: application-quality-sonarqube
  # The API server injects apiVersion/kind/volumeMode/status into
  # StatefulSet volumeClaimTemplates entries that the chart doesn't set,
  # which otherwise shows as permanent drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.volumeClaimTemplates'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

---

# --- SonarQube Application ---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-quality-sonarqube
  namespace: argocd
  labels:
    eoepca/app-name: application-quality
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: eoepca
  sources:
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      path: argocd/eoepca/application-quality/sonarqube
      # Owned by application-quality-sonarqube-db instead (wave 0), so the
      # postgresql chart doesn't deadlock waiting on this app's later wave.
      directory:
        exclude: "ss-application-quality-sonarqube-db-secrets.yaml"
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      targetRevision: 2026.2.1
      chart: sonarqube
      helm:
        releaseName: application-quality-sonarqube
        valueFiles:
          - $values/argocd/eoepca/application-quality/sonarqube/application-quality-sonarqube-values.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      ref: values
  destination:
    name: in-cluster
    namespace: application-quality-sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
