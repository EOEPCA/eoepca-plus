# --- PostgreSQL Application ---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-quality-sonarqube-db
  namespace: argocd
  labels:
    eoepca/app-name: application-quality
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: eoepca
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 17.1.0
      chart: postgresql
      helm:
        releaseName: application-quality-sonarqube
        valueFiles:
          - $values/argocd/eoepca/application-quality/parts/application-quality-sonarqube-db-values.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop
      ref: values
  destination:
    name: in-cluster
    namespace: application-quality-sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true

---

# --- SonarQube Application ---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-quality-sonarqube
  namespace: argocd
  labels:
    eoepca/app-name: application-quality
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: eoepca
  sources:
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      targetRevision: 10.3.0
      chart: sonarqube
      helm:
        releaseName: application-quality-sonarqube
        valueFiles:
          - $values/argocd/eoepca/application-quality/parts/application-quality-sonarqube-values.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop
      ref: values
  destination:
    name: in-cluster
    namespace: application-quality-sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
