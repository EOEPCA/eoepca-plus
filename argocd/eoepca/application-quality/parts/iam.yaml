---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: application-quality-client-roles-mapper
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: application-quality
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    name: client-roles-mapper
    config:
      "access.token.claim": "true"
      "id.token.claim": "true"
      "userinfo.token.claim": "true"
      "multivalued": "true"
      "claim.name": "roles"
      "jsonType.label": "String"
      "usermodel.clientRoleMapping.clientId": "application-quality"
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: application-quality-develop-dashboards
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: application-quality-develop-dashboards
    accessType: CONFIDENTIAL
    clientId: application-quality-develop-dashboards
    enabled: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    fullScopeAllowed: true
    serviceAccountsEnabled: false
    useRefreshTokens: true
    clientSecretSecretRef:
      name: application-quality-dashboards-iam-client
      key: client_secret
    rootUrl: https://application-quality.develop-v2.eoepca.org/dashboards
    validRedirectUris:
      - '/*'
    webOrigins:
      - '/*'
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: application-quality-dashboards-client-roles-mapper
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: application-quality-develop-dashboards
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    name: client-roles-mapper
    config:
      "access.token.claim": "true"
      "id.token.claim": "true"
      "userinfo.token.claim": "true"
      "multivalued": "true"
      "claim.name": "roles"
      "jsonType.label": "String"
      "usermodel.clientRoleMapping.clientId": "application-quality"
