apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: application-quality-bb
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: application-quality-bb
    accessType: PUBLIC
    clientId: application-quality-bb
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    fullScopeAllowed: true
    serviceAccountsEnabled: false
    rootUrl: https://application-quality.develop-v2.eoepca.org
    webOrigins:
      - https://application-quality.develop-v2.eoepca.org
    validRedirectUris:
      - https://application-quality.develop-v2.eoepca.org/*
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: application-quality
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: application-quality
    accessType: PUBLIC
    clientId: application-quality
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    fullScopeAllowed: true
    serviceAccountsEnabled: false
    rootUrl: https://application-quality.develop-v2.eoepca.org
    webOrigins:
      - '/*'
    validRedirectUris:
      - '/*'
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientDefaultScopes
metadata:
  name: application-quality-default-scopes
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: application-quality
      policy:
        resolution: Required
    defaultScopes:
      - roles
      - profile
      - email
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
