apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-access-core
  namespace: argocd
  labels:
    eoepca/app-name: data-access
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  sources:

    - repoURL: https://developmentseed.org/eoapi-k8s/
      chart: eoapi
      targetRevision: 0.16.2
      helm:
        releaseName: eoapi
        valueFiles:
          - values/argocd.yaml  # Upstream ArgoCD sync configuration
          - $values/argocd/eoepca/data-access/parts/values/values-eoapi.yaml

    - repoURL: https://github.com/sentinel-hub/titiler-openeo
      path: deployment/k8s/charts
      targetRevision: titiler-openeo-chart-v3.0.1
      helm:
        releaseName: eoapi-titiler-openeo
        values: |
          image:
            tag: "v0.18.2"
          stac:
            apiUrl: "https://eoapi.develop-v2.eoepca.org/stac"
            serviceStoreUrl: "/app/services/eoapi.json"
          env:
            TITILER_OPENEO_API_ROOT_PATH: "/openeo/"
          auth:
            method: "oidc"
            oidc:
              enabled: true
              clientId: "eoapi"
              wellKnownUrl: "https://develop-v2.eoepca.org/iam/auth/realms/eoepca/.well-known/openid-configuration"
              redirectUrl: "https://eoapi.develop-v2.eoepca.org/openeo/"
          podSecurityContext:
            sysctls:
              # TiTiler listens on TCP 80 as a non-root user. This pod-scoped
              # sysctl makes low ports unprivileged, so the container needs no
              # NET_BIND_SERVICE capability.
              - name: net.ipv4.ip_unprivileged_port_start
                value: "0"
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 65532
          initContainerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          extraVolumes:
            - name: services
              configMap:
                name: titiler-openeo-services
          extraVolumeMounts:
            - name: services
              mountPath: /app/services
              readOnly: true

    - repoURL: https://stac-manager.ds.io/
      chart: stac-manager
      targetRevision: 1.0.3
      helm:
        releaseName: eoapi-stac-manager
        valueFiles:
          - $values/argocd/eoepca/data-access/parts/values/values-stac-manager.yaml

    - repoURL: https://github.com/developmentseed/pgstac-geoparquet-exporter
      path: charts/pgstac-geoparquet-exporter
      targetRevision: v0.2.4
      helm:
        releaseName: eoapi-geoparquet-export
        valueFiles:
          - $values/argocd/eoepca/data-access/parts/values/values-pgstac-geoparquet-exporter.yaml

    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop
      ref: values

  destination:
    name: in-cluster
    namespace: data-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
