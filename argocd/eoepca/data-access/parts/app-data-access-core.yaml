apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-access-core
  namespace: argocd
  labels:
    eoepca/app-name: data-access
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  sources:

    - repoURL: https://developmentseed.org/eoapi-k8s/
      chart: eoapi
      targetRevision: 0.10.1
      helm:
        releaseName: eoapi
        valueFiles:
          - $values/argocd/eoepca/data-access/parts/values/values-eoapi.yaml

    - repoURL: https://github.com/sentinel-hub/titiler-openeo
      path: deployment/k8s/charts
      targetRevision: v0.9.1
      helm:
        releaseName: eoapi-titiler-openeo
        values: |
          image:
            tag: "v0.9.1"
          stac:
            apiUrl: "https://eoapi.rke2.deploybox.co.uk/stac"
            serviceStoreUrl: "/app/services/eoapi.json"
          env:
            TITILER_OPENEO_API_ROOT_PATH: "/openeo/"
          auth:
            method: "oidc"
            oidc:
              enabled: true
              clientId: "eoapi"
              wellKnownUrl: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/openid-configuration"
              redirectUrl: "https://eoapi.rke2.deploybox.co.uk/openeo/"
          extraVolumes:
            - name: services
              configMap:
                name: titiler-openeo-services
          extraVolumeMounts:
            - name: services
              mountPath: /app/services
              readOnly: true

    - repoURL: https://stac-manager.ds.io/
      chart: stac-manager
      targetRevision: 0.0.11
      helm:
        releaseName: eoapi-stac-manager
        valueFiles:
          - $values/argocd/eoepca/data-access/parts/values/values-stac-manager.yaml

    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: rke2-upgrade
      ref: values

  destination:
    name: in-cluster
    namespace: data-access
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
