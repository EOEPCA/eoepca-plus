apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: Client
metadata:
  name: eoapi
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    name: eoapi
    accessType: PUBLIC
    clientId: eoapi
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true # allow for now to simplify testing
    fullScopeAllowed: false
    serviceAccountsEnabled: false
    oauth2DeviceAuthorizationGrantEnabled: true
    rootUrl: https://eoapi.develop.eoepca.org
    webOrigins:
      - '*'
    validRedirectUris:
      - '*'
---
apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  name: stac-editor
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    name: stac_editor
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Group
metadata:
  name: data-access-admin
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    name: data-access-admin
---
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: data-access-admin
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    groupIdRef:
      name: data-access-admin
      policy:
        resolution: Required
    roleIdsRefs:
      - name: stac-editor
        policy:
          resolution: Required
---
apiVersion: client.keycloak.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: eoapi-audience-mapper
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    name: eoapi-audience
    config:
      "included.client.audience": "eoapi"
      "access.token.claim": "true"
      "id.token.claim": "false"
---
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientDefaultScopes
metadata:
  name: eoapi-default-scopes
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    defaultScopes:
      - profile
      - email
      - roles
      - web-origins
      - acr
      - basic
---
# Import built-in account client (observe-only, not managed by Crossplane)
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: Client
metadata:
  name: account-client
  annotations:
    crossplane.io/external-name: account  # The built-in client ID
spec:
  deletionPolicy: Orphan
  managementPolicies: ["Observe"]  # Read-only, don't modify
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    clientId: account
---
# Import built-in view-profile role from account client (observe-only)
apiVersion: role.keycloak.crossplane.io/v1alpha1
kind: Role
metadata:
  name: account-view-profile
  annotations:
    crossplane.io/external-name: view-profile  # The built-in role name
spec:
  deletionPolicy: Orphan
  managementPolicies: ["Observe"]  # Read-only, don't modify
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    name: view-profile
    clientIdRef:
      name: account-client
      policy:
        resolution: Required
---
# Map account view-profile role to eoapi client so users can access /account
apiVersion: client.keycloak.crossplane.io/v1alpha1
kind: RoleMapper
metadata:
  name: eoapi-account-view-profile-mapper
spec:
  providerConfigRef:
    name: iam-keycloak-keycloak-provider-config
  forProvider:
    realmId: eoepca
    clientIdRef:
      name: eoapi
      policy:
        resolution: Required
    roleIdRef:
      name: account-view-profile
      policy:
        resolution: Required
