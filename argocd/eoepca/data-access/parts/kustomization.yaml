resources:
  - ss-data-access.yaml
  - app-data-access-core.yaml
  - storage-geoparquet-exporter.yaml
  - iam.yaml
  - route.yaml
  - eso-pgo.yaml
  - deployment-synthetic-api-check.yaml
  - servicemonitor-stac-auth-proxy.yaml

configMapGenerator:
  - name: stac-auth-proxy-filters
    options:
      disableNameSuffixHash: true
    files:
      - eoepca_filters.py=stac-auth-proxy/eoepca_filters.py
  - name: titiler-openeo-services
    options:
      disableNameSuffixHash: true
    files:
      - eoapi.json=titiler-openeo/eoapi.json
  - name: synthetic-api-check-script
    options:
      disableNameSuffixHash: true
    files:
      - check-stac.sh=synthetic-api-check/check-stac.sh
  - name: stac-manager-branding
    options:
      disableNameSuffixHash: true
    files:
      - icon-512.png=stac-manager/assets/icon-512.png
      - icon-192.png=stac-manager/assets/icon-192.png
      - favicon.png=stac-manager/assets/favicon.png
      - apple-touch-icon.png=stac-manager/assets/apple-touch-icon.png
      - meta-image.png=stac-manager/assets/meta-image.png
