apiVersion: v1
kind: Service
metadata:
  name: iam-keycloak-external
  namespace: data-access
spec:
  type: ExternalName
  externalName: iam-keycloak.iam.svc.cluster.local
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: stac
  namespace: data-access
  # annotations:
  #   argocd.argoproj.io/sync-options: skip
spec:
  ingressClassName: apisix
  http:
  - name: manager-redirect
    websocket: true
    backends:
    - serviceName: eoapi-stac-manager
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /manager
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /manager/
  - name: manager-route
    websocket: true
    backends:
    - serviceName: eoapi-stac-manager
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /manager/
      - /manager/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/manager)($|/.*)
        - $2
      enable: true
    - name: cors
      enable: true
  - name: manager-auth-proxy
    backends:
    - serviceName: iam-keycloak-external
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /auth/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^/auth(.*)
        - $1
      enable: true
    - name: cors
      enable: true
  - name: browser-redirect
    backends:
    - serviceName: eoapi-browser
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /browser
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /browser/
  - name: browser-route
    backends:
    - serviceName: eoapi-browser
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /browser/
      - /browser/*
  - name: vector-redirect
    backends:
    - serviceName: eoapi-vector
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /vector
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /vector/
  - name: vector-route
    backends:
    - serviceName: eoapi-vector
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /vector/
      - /vector/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/vector)($|/.*)
        - $2
      enable: true
  - name: multidim-redirect
    backends:
    - serviceName: eoapi-multidim
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /multidim
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /multidim/
  - name: multidim-route
    backends:
    - serviceName: eoapi-multidim
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /multidim/
      - /multidim/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/multidim)($|/.*)
        - $2
      enable: true
  - name: raster-redirect
    backends:
    - serviceName: eoapi-raster
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /raster
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /raster/
  - name: raster-route
    backends:
    - serviceName: eoapi-raster
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /raster/
      - /raster/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/raster)($|/.*)
        - $2
      enable: true
  - name: openeo-redirect
    backends:
    - serviceName: eoapi-titiler-openeo
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /openeo
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /openeo/
  - name: openeo-route
    backends:
    - serviceName: eoapi-titiler-openeo
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /openeo/
      - /openeo/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/openeo)($|/.*)
        - $2
      enable: true
  - name: stac-redirect
    priority: 100
    backends:
    - serviceName: eoapi-stac-auth-proxy
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      methods:
      - GET
      paths:
      - /stac
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /stac/
    - name: cors
      enable: true
  - name: stac-route
    priority: 10
    backends:
    - serviceName: eoapi-stac-auth-proxy
      servicePort: 8080
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /stac/
      - /stac/*
    plugins:
    - name: proxy-rewrite
      config:
        headers:
          set:
            X-Forwarded-Port: "443"
            X-Forwarded-Proto: "https"
            X-Forwarded-Host: "eoapi.develop.eoepca.org"
      enable: true
    - name: serverless-post-function
      enable: true
      config:
        phase: "access"
        functions:
          - |
            return function(conf, ctx)
              ngx.req.set_header("X-Forwarded-Port", "443")
              ngx.req.set_header("X-Forwarded-Proto", "https")
              ngx.req.set_header("X-Forwarded-Host", "eoapi.develop.eoepca.org")
            end
    - name: cors
      enable: true
  - name: docs-redirect
    backends:
    - serviceName: eoapi-doc-server
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /docs
      - /
    plugins:
    - name: redirect
      enable: true
      config:
        uri: /docs/
  - name: docs-route
    backends:
    - serviceName: eoapi-doc-server
      servicePort: 80
    match:
      hosts:
      - eoapi.develop.eoepca.org
      paths:
      - /docs/
      - /docs/*
    plugins:
    - name: proxy-rewrite
      config:
        regex_uri:
        - ^(/docs)($|/.*)
        - $2
      enable: true
