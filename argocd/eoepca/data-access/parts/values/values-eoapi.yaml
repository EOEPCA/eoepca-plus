ingress:
  enabled: false

postgresql:
  type: "external-secret"
  external:
    existingSecret:
      name: "default-pguser-eoapi"
      keys:
        username: "user"
        password: "password"
        host: "host"
        port: "port"
        database: "dbname"

postgrescluster:
  enabled: false

pgstacBootstrap:
  enabled: true
  settings:
    pgstacSettings:
      use_queue: "true"
      update_collection_extent: "false"
      context: "off"
    envVars:
      KEEP_ALIVE: "false"
  queueProcessor:
    schedule: "0 * * * *"
  extentUpdater:
    schedule: "0 */12 * * *"

raster:
  enabled: true
  ingress:
    path: "/raster"
  overrideRootPath: "/"
  settings:
    envVars:
      AWS_S3_ENDPOINT: "eodata.cloudferro.com"
      AWS_VIRTUAL_HOSTING: "FALSE"
      # 1×1×1×5 = 5 conn
      WEB_CONCURRENCY: "1"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"
    envSecrets:
      - data-access
    resources:
      requests:
        memory: "3072Mi"

multidim:
  enabled: true
  ingress:
    path: "/multidim"
  overrideRootPath: "/"
  settings:
    envVars:
      # 1×1×1×5 = 5 conn
      WEB_CONCURRENCY: "1"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"
    envSecrets:
          - data-access
    resources:
      requests:
        memory: "1024Mi"

stac:
  enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    type: "cpu"
    targets:
      cpu: 50
  settings:
    envVars:
      ENABLE_TRANSACTIONS_EXTENSIONS: "TRUE"
      STAC_FASTAPI_TITLE: "EOEPCA STAC API"
      STAC_FASTAPI_DESCRIPTION: "A STAC Catalog for the Earth Observation Exploitation Platform Common Architecture (EOEPCA)"
      # replicas×2 workers×2 pools×3 = 24–60 conn (read+write pools when transactions enabled)
      WEB_CONCURRENCY: "2"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "3"
    resources:
      limits:
        cpu: "1280m"
        memory: "1536Mi"
      requests:
        cpu: "512m"

vector:
  enabled: true
  settings:
    resources:
      limits:
        memory: "1536Mi"
      requests:
        memory: "1024Mi"
    envVars:
      # needs to be on so we can call /refresh for integration tests
      TIPG_DEBUG: "True"
      TIPG_CATALOG_TTL: "30"
      # 1×1×1×5 = 5 conn
      WEB_CONCURRENCY: "1"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"

eoapi-notifier:
  enabled: true
  config:
    sources:
      - type: pgstac
        config:
          channel: "pgstac_items_change"
          connection:
            existingSecret:
              name: "default-pguser-eoapi"
              keys:
                username: "user"
                password: "password"
                host: "host"
                port: "port"
                database: "dbname"
    outputs:
      - type: cloudevents
        config:
          source: /eoapi/pgstac
          event_type: org.eoapi.stac.item
          destination:
            ref:
              apiVersion: eventing.knative.dev/v1
              kind: Broker
              name: primary
              namespace: default

stac-auth-proxy:
  enabled: true
  image:
    tag: "v1.1.0"
  # Custom filters for STAC collections/items filtering
  service:
    port: 8080
  env:
    UPSTREAM_URL: "http://eoapi-stac.data-access.svc.cluster.local:8080"
    OIDC_DISCOVERY_URL: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
    OIDC_DISCOVERY_INTERNAL_URL: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
    COLLECTIONS_FILTER_CLS: stac_auth_proxy.eoepca_filters:CollectionsFilter
    ITEMS_FILTER_CLS: stac_auth_proxy.eoepca_filters:ItemsFilter
    ALLOWED_JWT_AUDIENCES: eoapi
    # stac_editor write bypass: tokens whose `azp` is one of these client IDs
    # AND that carry the STAC_EDITOR_ROLE under resource_access.<azp>.roles get
    # unrestricted catalog-wide writes. Must be a subset of ALLOWED_JWT_AUDIENCES
    # (otherwise the proxy rejects the token before it reaches the filter).
    # SECURITY: only list confidential clients trusted to gate the role
    # assignment — never a public client where users can self-register.
    STAC_EDITOR_CLIENT_IDS: eoapi,registration-harvester
    STAC_EDITOR_ROLE: stac_editor
    PUBLIC_ENDPOINTS: |
      {
        "^/$": ["GET"],
        "^/api.html$": ["GET"],
        "^/api$": ["GET"],
        "^/conformance$": ["GET"],
        "^/docs/oauth2-redirect": ["GET"],
        "^/healthz": ["GET"],
        "^/_mgmt/ping": ["GET"]
      }
    ROOT_PATH: "/stac"
    SWAGGER_UI_INIT_OAUTH: |
      {
        "clientId": "eoapi",
        "usePkceWithAuthorizationCodeGrant": true
      }
  extraVolumes:
    - name: filters
      configMap:
        name: stac-auth-proxy-filters
  extraVolumeMounts:
    - name: filters
      mountPath: /app/src/stac_auth_proxy/eoepca_filters.py
      subPath: eoepca_filters.py
      readOnly: true
  # Override health check paths to include ROOT_PATH
  startupProbe:
    httpGet:
      path: /stac/healthz
      port: http
    periodSeconds: 2
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /stac/healthz
      port: http
    periodSeconds: 60
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /stac/healthz
      port: http
    periodSeconds: 5
    failureThreshold: 3

browser:
  catalogUrl: "https://eoapi.develop.eoepca.org/stac"
  catalogTitle: "EOEPCA Data Catalog"
  catalogImage: "https://eoepca.org/media_portal/images/eoepca_logo_no_bg.original.png"
  footerLinks:
    - label: "Website"
      url: "https://eoepca.org/"
    - label: "Documentation"
      url: "https://docs.eoepca.org/"
  authConfig:
    type: "openIdConnect"
    openIdConnectUrl: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
    oidcConfig:
      client_id: "eoapi"
      redirect_uri: "https://eoapi.develop.eoepca.org/browser/auth"
