nameOverride: "eoapi-stac-manager"

ingress:
  enabled: false
resources:
  requests:
    memory: "1Gi"
    cpu: "1"
  limits:
    memory: "4Gi"
    cpu: "4"
image:
  tag: latest
  pullPolicy: Always

publicUrl: https://eoapi.rke2.deploybox.co.uk/manager
stacApi: https://eoapi.rke2.deploybox.co.uk/stac/
primaryColor: "#005ACD"
secondaryColor: "#048A81"

oidc:
  providerUrl: https://iam-auth.rke2.deploybox.co.uk
  clientId: eoapi
  realm: eoepca
