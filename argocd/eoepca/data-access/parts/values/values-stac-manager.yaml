nameOverride: "eoapi-stac-manager"

ingress:
  enabled: false
resources:
  requests:
    memory: "1Gi"
    cpu: "1"
  limits:
    memory: "4Gi"
    cpu: "4"
image:
  tag: sha-5e42d18
  pullPolicy: Always

publicUrl: https://eoapi.develop.eoepca.org/manager
stacApi: https://eoapi.develop.eoepca.org/stac
stacBrowser: https://eoapi.develop.eoepca.org/browser
primaryColor: "#005ACD"
secondaryColor: "#048A81"
appTitle: "EOEPCA+ STAC Manager"
appDescription: "Manage STAC collections and items on the EOEPCA+ platform"

oidc:
  authority: https://iam-auth.develop.eoepca.org/realms/eoepca
  clientId: eoapi

# Custom branding assets (EOEPCA logo)
# The ConfigMap 'stac-manager-branding' is generated by Kustomize from
# the files in parts/stac-manager/assets/.
# See parts/stac-manager/README.md for instructions on
# regenerating the logo files.
volumes:
  - name: branding
    configMap:
      name: stac-manager-branding
volumeMounts:
  - name: branding
    mountPath: /app/packages/client/dist/meta
