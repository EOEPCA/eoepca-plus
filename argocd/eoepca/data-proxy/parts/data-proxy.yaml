apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-proxy-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    eoepca/app-name: data-proxy
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  sources:
    - chart: eodag-data-proxy-chart
      repoURL: 643vlk6z.gra7.container-registry.ovh.net/space_applications
      targetRevision: 0.1.0
      helm:
        releaseName: eodag-data-proxy
        values: |
          imagePullSecrets:
            - name: cs-container-pull

          image:
            repository: 643vlk6z.gra7.container-registry.ovh.net/space_applications/eodag-data-proxy
            tag: "0.1"

          proxyEnv:
            eodagUrl: http://eodag-data-proxy-eodag-data-proxy-chart-control-plane:8000
            authIssuerUrl: https://iam-auth.rke2.deploybox.co.uk/realms/eoepca
            authAudience: eodag-proxy
            authJwksUrl: https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/openid-configuration

          opa:
            # Chart 0.1.0 hardcodes "opa run --config", but current OPA
            # images require "--config-file"; disable the sidecar until the
            # chart exposes args or updates the flag.
            enabled: false
            configMap: opa-config

          ingress:
            enabled: false # APISIX

          controlPlane:
            image:
              repository: 643vlk6z.gra7.container-registry.ovh.net/space_applications/eodag-control-plane
              tag: "0.1"

  destination:
    name: in-cluster
    namespace: data-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
