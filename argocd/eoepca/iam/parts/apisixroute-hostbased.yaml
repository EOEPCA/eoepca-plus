# Additional, manually created route for host-based routing to IAM services.
# Meant as a temporary solution to allow host-based access after
# migrating to path-based routing.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: iam-hostbased-route
  namespace: iam
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # iam-core's Crossplane provider authenticates through this route, so the
    # route must not wait for iam-core itself to become Healthy.
    argocd.argoproj.io/sync-wave: "0"
spec:
  ingressClassName: apisix
  http:
  - name: keycloak
    match:
      hosts:
        - iam-auth.develop-v2.eoepca.org
      paths:
        - /*
    backends:
      - serviceName: iam-core-keycloak-operator-service
        servicePort: 8080
  - name: opa
    match:
      hosts:
        - iam-opa.develop-v2.eoepca.org
      paths:
        - /*
#    backends:
#      - serviceName: iam-opa
#        servicePort: 8181
    plugins:
      - name: redirect
        enable: true
        config:
          regex_uri:
            - /(.*)
            - https://develop-v2.eoepca.org/iam/opa/$1
