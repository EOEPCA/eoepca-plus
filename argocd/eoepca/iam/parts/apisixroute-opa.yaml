# Note: This file is not needed if OPAL is deployed via the iam-bb Helm chart,
# because the chart is able to create the route automatically.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: opa-route
spec:
  ingressClassName: apisix
  http:
  - name: opa
    match:
      hosts:
      - iam-opa.develop.eoepca.org
      paths:
      - /*
    backends:
    - serviceName: iam-opa
      servicePort: 8181
    plugins:
      # TODO: Configure client secrets through secretRef
      - name: openid-connect
        enable: true
        config:
          client_id: "opa"
          client_secret: "RkAUBGEzUCCgKBydiagDGqW5JJeXYdDQ"
          session:
            secret: 0123456789abcdef
          #bearer_only: true
          #realm: "eoepca"
          #redirect_uri: "http://iam-test.develop.eoepca.org/"
          access_token_in_authorization_header: true
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
      - name: authz-keycloak
        enable: true
        config:
          client_id: "opa"
          client_secret: "RkAUBGEzUCCgKBydiagDGqW5JJeXYdDQ"
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/uma2-configuration"
          #permissions: "Resource all"
          lazy_load_paths: true
          ssl_verify: false
  - name: opa
    match:
      hosts:
        - iam-opa.develop.eoepca.org
      paths:
        - /*
    backends:
      - serviceName: iam-opa
        servicePort: 8181
    plugins:
      - name: openid-connect
        enable: true
        config:
          client_id: "opa"
          client_secret: "RkAUBGEzUCCgKBydiagDGqW5JJeXYdDQ"
          session:
            secret: 0123456789abcdef
          access_token_in_authorization_header: true
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
      - name: authz-keycloak
        enable: true
        config:
          client_id: "opa"
          client_secret: "RkAUBGEzUCCgKBydiagDGqW5JJeXYdDQ"
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/uma2-configuration"
          #permissions: "Resource all"
          lazy_load_paths: true
          ssl_verify: false
