apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iam-core
  namespace: argocd
  labels:
    eoepca/app-name: iam-core
spec:
  project: eoepca
  sources:
    - repoURL: https://eoepca.github.io/helm-charts-dev
      chart: iam-bb
      targetRevision: 2.1.0-dev15
      helm:
        valueFiles:
          - $values/argocd/eoepca/iam/parts/values/iam-values.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop
      ref: values

  destination:
    name: in-cluster
    namespace: iam
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: keycloak-provider
      namespace: iam
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: opa-route
      namespace: iam
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: postgresql
      namespace: iam
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
