# Custom realm-level roles present in the live eoepca realm with no single
# owning building block. No repo config currently assigns these to any
# user/group/client — declared here so they exist declaratively; grant them
# to users/groups in the owning building block's iam.yaml as needed.
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: eoepca-user-premium
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: user-premium
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: eoepca-admin-ui
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: admin-ui
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: eoepca-user
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: user
