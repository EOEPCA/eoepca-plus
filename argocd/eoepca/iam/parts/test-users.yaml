metadata:
  name: bob
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    username: bob
    firstName: Bob
    lastName: Test
    email: bob@example.com
    emailVerified: true
    enabled: true
    initialPassword:
      - temporary: false
        valueSecretRef:
