apiVersion: user.keycloak.m.crossplane.io/v1alpha1
kind: User
metadata:
  name: alice
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    username: alice
    firstName: Alice
    lastName: Test
    email: alice@example.com
    emailVerified: true
    enabled: true
    initialPassword:
      - temporary: false
        valueSecretRef:
          name: test-users
          key: alice-password
---
apiVersion: user.keycloak.m.crossplane.io/v1alpha1
