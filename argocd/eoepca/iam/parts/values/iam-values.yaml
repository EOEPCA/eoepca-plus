#                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
#                "config": {
#                  "syncMode": "INHERIT",
#                  "claim": "sub",
#                  "user.attribute": "username"
#                }
#              }
#            ]
      provider:
        # Reference to existing ProviderConfig to use (instead of creating own one)
        existingConfigRef: ""
        # Set to true to generate ProviderConfig for Keycloak (only honoured if
        # useCrossplane is true)
        create: true
        # Set to true to create a client with service account to be used by Crossplane
        # Keycloak Provider. (only honoured if realm.create is true, but
        # independent of useCrossplane setting)
        createServiceAccount: true
        # Client secret for the Crossplane Keycloak Provider client.
        # Unfortunately it is currently not possible to generate this secret via
        # kubernetes-secret-generator. Therefore it must either be specified here
        # or provided through an existing secret. Having the secret generated by
        # Helm is possible, but not recommended, because updates are not handled
        # properly.
        clientSecret: ""
        # Reference to existing secret containing Keycloak location and credentials
        secretRef:
          name: "keycloak-provider"
          key: "credentials"
          #namespace: "" #crossplane-system
    tls:
      # Set to true to use TLS on route from APISIX to Keycloak
      # Make sure to also configure keycloak-operator.keycloak.http.tlsSecret
      # if you set this option to true.
      enabled: false
      # Set to true to autogenerate a TLS certificate for Keycloak.
      autoGenerate: true
      # Name of TLS secret to use. Set to existing secret of your choice or to
      # "keycloak-tls" to refer to the autogenerated TLS cert.
      # Leave empty if TLS is disabled.
      tlsSecretRef: &tlsSecretRef ~
      #tlsSecretRef: &tlsSecretRef keycloak-tls
    cors:
      # Set this to true to enable CORS
      enabled: true
      # Allowed origin(s). Can be string or comma-separated list:
      #   - string: "*" or "https://example.org" or "https://a.com,https://b.com"
      #   - list: ["https://a.com", "https://b.com"]
      allowedOrigins: "https://eoapi.rke2.deploybox.co.uk,https://editor.openeo.org"
      # Comma-separated list of allowed headers.
      # APISIX constraint: When allowCredentials=true, cannot use "*" for origins, headers, or expose_headers.
      allowedHeaders: "Authorization,Content-Type,Accept,Origin,X-Requested-With"
      # Comma-separated list of exposed headers.
      exposedHeaders: "Content-Length,Content-Type"
      # Comma-separated list of allowed methods for CORS requests.
      allowedMethods: "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS"
      # Allow credentials (cookies, authorization headers)
      allowCredentials: true
      # Preflight cache max age (seconds).
      maxAge: 3600
    postgres:
      enabled: true
      # Database host
      host: &pgHost iam-postgresql
      # Name of the database
      database: &pgDatabase keycloak
      # Username of Keycloak PostgreSQL user. Ignored if secretRef is set.
      username: keycloak
      # Password of Keycloak PostgreSQL user. Autogenerated if omitted.
      # Ignored if secretRef is set or useSecretGenerator is true.
      # Note: Set to a fixed value for now, because preservation does not work with ArgoCD.
#      password: "2OT8Mnd3ND7LzzvlD4jJiCeqdV8j6xjX"
      # Name of existing secret that contains username and password for PostgreSQL
      secretRef: "kc-postgres"

  opa:
    enabled: true
    # inline: true: Use inline OPA; false: deploy and use OPA in a separate pod.
    # If set to true, opal.client.extraEnv.OPAL_INLINE_OPA_ENABLED must
    # be set to "True" so that inline OPA is actually started.
    inline: false
    createRoute: true
    # "Official" OPA URL (used as root URL for the client if one is created)
    url: https://rke2.deploybox.co.uk/iam/opa
    hosts:
#      - iam-opa.rke2.deploybox.co.uk
      - rke2.deploybox.co.uk
    paths:
 #     - /*
      - /iam/opa
      - /iam/opa/*
      - /iam/policies
      - /iam/policies/*
    # Array of path prefixes to strip. Useful for path-based routing.
    # Note: Stripping the path prefix is necessary for OPA.
    stripPaths:
      - /iam/opa
      - /iam/policies
    # Client credentials:
    # clientId is mandatory if clientSecretRef is *not* specified.
    clientId: opa
    # clientSecret: Client secret as plain text (generated internally if omitted)
    clientSecret: ""
    # clientSecretRef: Name of an existing secret that contains the client secret and maybe further values like the client ID
    clientSecretRef: "opa-route"
    # OPA image to pull.
    # Note: This does not have an effect if inline OPA is used.
    image:
      #registry: docker.io
      #repository: openpolicyagent/opa
      tag: 1.7.1
      #pullPolicy: IfNotPresent
  apisix:
    enabled: false
    # Ingress class name for APISIX. Also used for ingressClassName attribute of routes etc.
    # Defaults to "apisix"
    ingressClassName: &ingressClassName apisix
  config:
    # Set this to true in order to apply iam-bb-config as a subchart.
    # If set to false, iam-bb-config must be applied separately if needed.
    enabled: true #false
    # Allows specifying a deviating namespace to which Crossplane resources
    # shall be installed.
    # This parameter is also taken into account by the main Helm chart if
    # iam.keycloak.configuration.createSecretStore is set to "auto".
    # Note: The namespace must already exist. It is not created by the Helm chart.
    targetNamespace: iam-management
    # If a target namespace is specified and this parameter is true, the config Helm
    # chart generates external secrets in the target namespace, which effectively
    # creates a copy of the provider and opa-route secrets in the management namespace.
    # This parameter is also taken into account by the main Helm chart if
    # iam.keycloak.configuration.createSecretStore is set to "auto".
    # Note that this requires External Secrets Operator to be installed.
    propagateSecrets: true
#    # TODO: Remove (temporarily added to work around wrong condition in iam-bb Helm chart)
#    propagateProviderSecret: true

