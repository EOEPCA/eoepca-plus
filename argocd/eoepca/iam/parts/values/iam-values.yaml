            - alias: "github"
              displayName: "GitHub"
              providerId: "github"
              enabled: true
              updateProfileFirstLoginMode: "on"
              trustEmail: false
              storeToken: false
              addReadTokenRoleOnCreate: false
              authenticateByDefault: false
              linkOnly: false
              hideOnLogin: false
              config:
                clientId: "Ov23liNXqUxucibgSQ93"
                acceptsPromptNoneForwardFromClient: "false"
