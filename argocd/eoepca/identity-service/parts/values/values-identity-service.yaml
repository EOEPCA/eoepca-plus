identity-keycloak:
  secrets:
    # Values for secret 'identity-keycloak'
    # Note - if ommitted, these can instead be set by creating the secret independently.
    kcDbPassword: "changeme"
    keycloakAdminPassword: "changeme"
  ingress:
    enabled: true
    className: nginx
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: keycloak-v1x.develop-v2.eoepca.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: identity-keycloak-tls
        hosts:
          - keycloak-v1x.develop-v2.eoepca.org
identity-postgres:
  secrets:
    # Values for secret 'identity-postgres'
    # Note - if ommitted, these can instead be set by creating the secret independently.
    postgresPassword: "changeme"
    pgPassword: "changeme"
  volumeClaim:
    name: identity-service
identity-api:
  secrets:
    # Values for secret 'identity-api'
    # Note - if ommitted, these can instead be set by creating the secret independently
    # e.g. as a SealedSecret via GitOps.
    adminPassword: "changeme"
  deployment:
    # Config values that can be passed via env vars
    extraEnv:
      - name: AUTH_SERVER_URL  # see configMap.authServerUrl instead
        # In-cluster service DNS, not the public keycloak-v1x.develop-v2.eoepca.org
        # hostname: that Ingress uses ingressClassName nginx, but nothing on
        # this cluster's public IP routes to the nginx controller for this
        # domain (only argocd.develop-v2.eoepca.org does, via a separate
        # DNS/LB path), so the public URL 404s and identity-api crashlooped
        # on OIDC discovery at startup. Talking to Keycloak directly sidesteps
        # that broken external hop entirely.
        value: http://identity-keycloak.um.svc.cluster.local:8080
      - name: ADMIN_USERNAME
        value: "admin"
      - name: REALM
        value: "master"
      # - name: VERSION
      #   value: v1.0.0
      - name: LOG_LEVEL
        value: DEBUG
identity-api-gatekeeper:
  config:
    client-id: identity-api
    # Same reasoning as identity-api's AUTH_SERVER_URL above: the public
    # keycloak-v1x hostname isn't routable, so gatekeeper talks to Keycloak
    # over the in-cluster service instead.
    discovery-url: http://identity-keycloak.um.svc.cluster.local:8080/realms/master
    cookie-domain: develop-v2.eoepca.org
  targetService:
    host: identity-api.develop-v2.eoepca.org
  secrets:
    # Values for secret 'identity-api-protection'
    # Note - if ommitted, these can instead be set by creating the secret independently.
    clientSecret: "changeme"
    encryptionKey: "changemechangeme"
  ingress:
    # This chart's Ingress relies on nginx.ingress.kubernetes.io/configuration-snippet
    # and server-snippet (the auth_request pattern gatekeeper needs), but this
    # cluster's ingress-nginx has snippet annotations disabled admin-wide, so
    # the resource is rejected by the nginx admission webhook on every sync.
    # Nothing else in the repo references identity-api externally, so disable
    # it rather than leave identity-service-core permanently OutOfSync.
    enabled: false
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
