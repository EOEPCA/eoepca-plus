
resources:
  - namespaces.yaml
  - resource-catalogue
  - registration-api
  - data-access
  - data-proxy
  - datacube-access
  # - zoo-dru
  - zoo-dru-wes
  - zoo-dru-std
  - zoo-dru-keda
  - workspace
  - mlops
  - application-quality
  - portal-v1x
  - registration-harvester
  - iam
  - application-hub
  - operations
  - resource-health
  - openeo-geotrellis
  - openeo-web-editor
  - openeofed
  - openeo-argoworkflows
  - notification-automation
  - identity-service


patches:
  # IAM is the first EOEPCA service because most BBs create clients/users via
  # its Crossplane provider. Later waves contain consumers of those clients.
  - target:
      version: v1
      kind: Namespace
      name: ^application-quality-sonarqube$
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: eoepca-precreated-namespaces
        annotations:
          argocd.argoproj.io/sync-wave: "28"
  - target:
      kind: Application
      name: ^iam$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: iam
        annotations:
          argocd.argoproj.io/sync-wave: "10"
  - target:
      kind: Application
      name: ^(data-proxy|resource-catalogue)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: eoepca-foundations
        annotations:
          # data-proxy was previously unmatched by any of these patches, so it
          # defaulted to wave 0 -- earlier than iam's wave 10. Its Client
          # (data-proxy/parts/iam.yaml) can't reach Ready without
          # keycloak-provider-config, which iam creates, so the whole root
          # app deadlocked waiting on Application/data-proxy at wave 0.
          argocd.argoproj.io/sync-wave: "20"
  - target:
      kind: Application
      name: ^data-access$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: data-access
        annotations:
          # data-access/parts/storage-geoparquet-exporter.yaml is a Storage
          # (pkg.internal) composite resource. That CRD/XRD is installed by
          # the workspace-pipeline chart's Configuration packages
          # (storage-minio, datalab-educates), part of the "workspace" BB at
          # wave 30 -- not by anything in data-access itself. At wave 20,
          # data-access tried to create it before the CRD existed, got a
          # hard SyncFailed (not just a health wait), exhausted its retries,
          # and permanently deadlocked the root app waiting on
          # Application/data-access. Must run after workspace (wave 30).
          argocd.argoproj.io/sync-wave: "31"
  - target:
      kind: Application
      name: ^(application-quality|application-quality-sonarqube-db|mlops|openeo-argoworkflows|openeo-geotrellis|registration-api|workspace)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: eoepca-services
        annotations:
          argocd.argoproj.io/sync-wave: "30"
  - target:
      kind: Application
      name: ^datacube-access$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: datacube-access
        annotations:
          # The configured backend is the Data Access STAC endpoint, so this
          # must run after data-access (now wave 31, see above).
          argocd.argoproj.io/sync-wave: "32"
  - target:
      kind: Application
      name: ^application-quality-sonarqube$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: application-quality-sonarqube
        annotations:
          # SonarQube consumes the database Application from wave 30.
          argocd.argoproj.io/sync-wave: "31"
  - target:
      kind: Application
      name: ^resource-health$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: resource-health
        annotations:
          # resource-health-bb's Client needs keycloak-provider-config (iam,
          # wave 10). resource-health is a normal app-resource-health.yaml
          # -> parts/ Application now (see its kustomization.yaml comment),
          # so this wave only controls the wrapper; everything inside parts/
          # has its own locally-scoped wave sequence.
          argocd.argoproj.io/sync-wave: "31"
  - target:
      kind: Application
      name: ^(openeofed|registration-harvester|zoo-project-dru|zoo-project-dru-keda|zoo-project-dru-std|zoo-project-dru-wes)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: eoepca-dependent-services
        annotations:
          argocd.argoproj.io/sync-wave: "40"
  - target:
      kind: Application
      name: ^(openeo-web-editor|portal-v1x)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: eoepca-frontends
        annotations:
          # User-facing frontends come up after their APIs/backends.
          argocd.argoproj.io/sync-wave: "50"
  - target:
      kind: Application
      name: ^(application-hub|identity-service|notification-automation|operations)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: eoepca-independent-services
        annotations:
          # Nothing else in this repo references application-hub,
          # identity-service, notification-automation or operations (no BB
          # reads their endpoints/secrets/namespaces). Previously
          # identity-service/notification-automation/operations shared wave
          # 20 with data-access/resource-catalogue, so a Degraded app here
          # blocked every later wave (21-50, ~16 unrelated BBs) from ever
          # being created; application-hub had the same effect from wave 30.
          # Give them the last wave, after even the frontends, so a problem
          # in any one of them stays isolated instead of cascading.
          argocd.argoproj.io/sync-wave: "55"
  # application-quality-sonarqube is the only piece left that inlines raw
  # manifests directly into this kustomization instead of isolating them
  # behind their own nested "parts" Application (see application-quality's
  # kustomization.yaml comment). resource-health used to as well, but was
  # restructured to the standard app-X.yaml -> parts/ pattern like every
  # other BB (see resource-health/kustomization.yaml). Scope these patches
  # by name (not just group/kind) so they can't silently reset the wave of
  # some future, unrelated resource of the same kind added anywhere else in
  # this kustomization.
  - target:
      group: bitnami.com
      kind: SealedSecret
      name: ^(application-quality-sonarqube-db-secrets|application-quality-sonarqube-monitoring-passcode)$
    patch: |
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: eoepca-sealed-secrets
        annotations:
          argocd.argoproj.io/sync-wave: "29"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: apisix.apache.org
      name: ^application-quality-sonarqube-route$
    patch: |
      apiVersion: apisix.apache.org/v2
      kind: ApisixRoute
      metadata:
        name: eoepca-routes
        annotations:
          argocd.argoproj.io/sync-wave: "32"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
