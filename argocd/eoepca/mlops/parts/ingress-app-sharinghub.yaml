apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sharinghub
  namespace: sharinghub
  annotations:
    kubernetes.io/ingress.class: apisix
    apisix.apache.org/ssl-redirect: "true"
    k8s.apisix.apache.org/enable-cors: "true"
    k8s.apisix.apache.org/upstream-read-timeout: "600s"
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  ingressClassName: apisix
  rules:
    - host: develop-v2.eoepca.org
      http:
        paths:
          - path: /sharinghub/
            pathType: Prefix
            backend:
              service:
                name: sharinghub
                port:
                  number: 8000
  # No tls block: develop-v2.eoepca.org already has a cluster-wide SNI cert
  # registered by infra/apisix/parts/apisixtls-apx-main.yaml. See the
  # comment in ingress-mlflow-sharinghub.yaml for why this route doesn't
  # provision its own duplicate certificate.
