apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: mlflow-sharinghub
  namespace: sharinghub
spec:
  timeout:
    read: "600s"
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mlflow-sharinghub
  namespace: sharinghub
spec:
  ingressClassName: apisix
  http:
  - name: mlflow-sharinghub
    match:
      hosts:
      - develop-v2.eoepca.org
      paths:
      - /mlflow
      - /mlflow/*
    backends:
    - serviceName: mlflow-sharinghub
      servicePort: 5000
    plugins:
    - name: cors
      enable: true
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/mlflow($|/)(.*)
          - /$2
        scheme: https
        headers:
          set:
            X-Script-Name: /mlflow
# no separate cert: apisix's cluster-wide wildcard cert already covers this
# host, a duplicate just burns letsencrypt's rate limit
