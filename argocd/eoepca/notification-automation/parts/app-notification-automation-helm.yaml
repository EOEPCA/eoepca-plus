apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-automation-helm
  namespace: argocd
  labels:
    eoepca/app-name: notification-automation
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    repoURL: https://github.com/EOEPCA/helm-charts-dev.git
    targetRevision: develop
    path: charts/notification-automation
    helm:
      releaseName: notification-automation
      parameters:
        # KnativeServing/KnativeEventing are created directly by this BB's
        # own parts/knative-serving.yaml and parts/knative-eventing.yaml
        # (with the correct notifications.rke2.deploybox.co.uk domain). The
        # chart defaults these to false for the same reason; leaving them
        # "true" here made the chart create a second, conflicting copy of
        # each CR (wrong domain, different version), and the two Applications
        # fought over ownership every sync.
        - name: serving.install
          value: "false"
        - name: eventing.install
          value: "false"
        - name: eventing.authenticationOidc
          value: "false"
        - name: webhookSource.enabled
          value: "true"
        - name: webhookSource.secrets.create
          value: "true"
        - name: webhookSource.secrets.githubSecret
          value: "123abc123"
        - name: webhookSource.sinkBinding.create
          value: "true"
        - name: cloudEventsPlayer.enabled
          value: "true"
        - name: cloudEventsPlayer.subscribeBroker.enabled
          value: "true"
        - name: emailer.install
          value: "true"
        - name: emailer.config.emailFrom
          value: "noreply@example.com"
        - name: emailer.config.emailTo
          value: "team@example.com"
        - name: emailer.config.yagmailHost
          value: "smtp.example.com"
        - name: emailer.config.yagmailPort
          value: "587"
        - name: emailer.config.yagmailUser
          value: "user@example.com"
        - name: emailer.config.yagmailPassword
          value: "password"
        - name: emailer.config.yagmailSmtpStarttls
          value: "true"
        
  destination:
    name: in-cluster
    namespace: na
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
