---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: openeo-route
  namespace: openeo
spec:
  ingressClassName: apisix
  http:
    # Open access to OpenEO API documentation and discovery endpoints
    - name: openeo-docs
      match:
        hosts:
          - openeo-eurac.develop-v2.eoepca.org
        paths:
          - /*
        exprs:
          - subject:
              scope: Path
              name: uri
            op: RegexMatch
            value: "^/(\\.well-known.*|openeo/1\\.1\\.0/?$|openeo/1\\.1\\.0/\\.well-known.*|openeo/1\\.1\\.0/credentials.*|openeo/1\\.1\\.0/file_formats.*|openeo/1\\.1\\.0/service_types.*|openeo/1\\.1\\.0/udf_runtimes.*|openeo/1\\.1\\.0/collections.*|openeo/1\\.1\\.0/processes.*|openeo/1\\.1\\.0/process_graphs.*|openeo/1\\.1\\.0/conformance.*)"
      backends:
        - serviceName: openeo-openeo-argo
          servicePort: 8000
      plugins:
        # Allow CORS access
        - name: cors
          enable: true
    # Authorized access to OpenEO protected endpoints (jobs, files)
    - name: openeo-protected
      match:
        hosts:
          - openeo-eurac.develop-v2.eoepca.org
        paths:
          - /openeo/1.1.0/jobs*
          - /openeo/1.1.0/files*
          - /openeo/1.1.0/me*
      backends:
        - serviceName: openeo-openeo-argo
          servicePort: 8000
      plugins:
        # Extract raw JWT from OpenEO's 'Bearer oidc/<provider>/<jwt>' format,
        # validate it via Keycloak JWKS, then restore the original header for the backend.
        - name: serverless-pre-function
          enable: true
          config:
            phase: access
            functions:
              - "return function(conf, ctx)
                  local core = require('apisix.core')
                  local http = require('resty.http')
                  local cjson = require('cjson')
                  local uri_args = core.request.get_uri_args(ctx)
                  if uri_args and uri_args['Signature'] then
                    return
                  end
                  local auth = core.request.header(ctx, 'Authorization') or ''
                  local jwt = auth:match('^[Bb]earer%s+oidc/[^/]+/(.+)$')
                  if not jwt then
                    core.response.exit(401, 'Unauthorized')
                  end
                  local httpc = http.new()
                  local res, err = httpc:request_uri(
                    'https://edp-portal.eurac.edu/auth/realms/edp/protocol/openid-connect/userinfo',
                    { method = 'GET', headers = { Authorization = 'Bearer ' .. jwt }, ssl_verify = false }
                  )
                  if not res or res.status ~= 200 then
                    core.response.exit(401, 'Unauthorized')
                  end
                end"
        # Allow CORS access
        - name: cors
          enable: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openeo-tls
  namespace: openeo
spec:
  dnsNames:
    - openeo-eurac.develop-v2.eoepca.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns-prod
  secretName: openeo-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: openeo
  namespace: openeo
spec:
  ingressClassName: apisix
  hosts:
    - openeo-eurac.develop-v2.eoepca.org
  secret:
    name: openeo-tls
    namespace: openeo
