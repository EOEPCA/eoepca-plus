---
resources:
  - openeo-geotrellis-zookeeper.yaml
  - openeo-geotrellis-sparkoperator.yaml
  - openeo-geotrellis-openeo.yaml
  - openeo-geotrellis-batch-rbac.yaml
  - ss-openeo-geotrellis-data-bucket-credentials.yaml
  - ss-openeo-geotrellis-eodata-credentials.yaml

patches:
  - target: {group: bitnami.com, kind: SealedSecret}
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "-10"}
  - target:
      group: argoproj.io
      kind: Application
      name: ^(openeo-geotrellis-sparkoperator|openeo-geotrellis-zookeeper)$
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "0"}
  - target:
      group: argoproj.io
      kind: Application
      name: ^openeo-geotrellis-openeo$
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-wave: "10"}
