---
image:
  registry: ghcr.io
  repository: kubeflow/spark-operator/kubectl
  tag: "2.5.2"
hook:
  upgradeCrd: true
  forceConflictsCrd: true
controller:
  logEncoder: json
  batchScheduler:
    enable: true
  podMonitor:
    create: false
  uiIngress:
    enable: false
  resources:
    requests:
      cpu: 200m
webhook:
  logEncoder: json
  resources:
    requests:
      cpu: 300m
spark:
  jobNamespaces:
    - ""
