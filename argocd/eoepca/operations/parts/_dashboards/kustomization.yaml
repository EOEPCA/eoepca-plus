apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: operations

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: curated-k8s-resources-cluster
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - kubernetes-cluster.json
  - name: curated-k8s-resources-pod
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - kubernetes-pods.json
  - name: curated-k8s-resources-node
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - kubernetes-nodes.json
  - name: curated-prometheus-overview
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - prometheus.json
  - name: curated-control-plane
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - kubernetes-api-and-etcd.json
  - name: curated-crossplane
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - crossplane-reconciliation.json
  - name: curated-security-compliance
    options:
      labels:
        eoepca/dashboard-category: compliance
        grafana_dashboard: "1"
    files:
      - compliance.json
  - name: curated-stac-slo
    options:
      labels:
        eoepca/dashboard-category: data-access
        grafana_dashboard: "1"
    files:
      - stac.json
  - name: workspaces-overview
    options:
      labels:
        eoepca/dashboard-category: workspace
        grafana_dashboard: "1"
        app.kubernetes.io/managed-by: manual
    files:
      - workspaces.json
