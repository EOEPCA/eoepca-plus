apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: operations

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: curated-k8s-resources-cluster
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - k8s-resources-cluster.json
  - name: curated-k8s-resources-pod
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - k8s-resources-pod.json
  - name: curated-k8s-resources-node
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - k8s-resources-node.json
  - name: curated-prometheus-overview
    options:
      labels:
        eoepca/dashboard-category: baseline
        grafana_dashboard: "1"
    files:
      - prometheus-overview.json
  - name: curated-security-compliance
    options:
      labels:
        eoepca/dashboard-category: compliance
        grafana_dashboard: "1"
    files:
      - security-compliance.json
  - name: curated-stac-slo
    options:
      labels:
        eoepca/dashboard-category: eo
        grafana_dashboard: "1"
    files:
      - stac-slo.json
