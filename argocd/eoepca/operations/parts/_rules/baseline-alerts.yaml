apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: baseline-alerts
  namespace: operations
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: baseline.monitoring
      rules:
        # Keep one alert firing to check delivery.
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
          annotations:
            summary: Alert delivery check is running.
        # Report scrape groups with over 10% failures.
        - alert: PrometheusTargetMissing
          expr: |
            100 * (
              count by (job, namespace, service) (up == 0)
              /
              count by (job, namespace, service) (up)
            ) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: More than 10% of scrape targets are down.
        # Ignore idle histogram samples during ingestion checks.
        - alert: PrometheusNotIngestingSamples
          expr: rate(prometheus_tsdb_head_samples_appended_total{type!="histogram"}[5m]) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Prometheus is ingesting fewer than one sample/sec.
        # Report rules that fail during evaluation.
        - alert: PrometheusRuleFailures
          expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Prometheus cannot evaluate a rule.
        # Report clients with over 1% server errors.
        - alert: KubeClientErrors
          expr: |
            (
              sum by (job, instance) (rate(rest_client_requests_total{code=~"5.."}[5m]))
              /
              sum by (job, instance) (rate(rest_client_requests_total[5m]))
            ) > 0.01
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes clients return more than 1% server errors.
    - name: baseline.nodes
      rules:
        # Report node exporters unreachable for ten minutes.
        - alert: NodeDown
          expr: up{job=~".*node-exporter.*"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Node exporter is unreachable.
        # Warn about filesystems with under 10% free.
        - alert: NodeFilesystemAlmostOutOfSpace
          expr: |
            (
              node_filesystem_avail_bytes{
                fstype!~"tmpfs|overlay|nsfs|squashfs",
                mountpoint!~"/run.*|/var/lib/kubelet/pods/.+"
              }
              /
              node_filesystem_size_bytes{
                fstype!~"tmpfs|overlay|nsfs|squashfs",
                mountpoint!~"/run.*|/var/lib/kubelet/pods/.+"
              }
            ) < 0.10
            and
            node_filesystem_readonly{
              fstype!~"tmpfs|overlay|nsfs|squashfs",
              mountpoint!~"/run.*|/var/lib/kubelet/pods/.+"
            } == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node filesystem has less than 10% free space.
        # Warn when free inodes fall below 10%.
        - alert: NodeFilesystemFilesFillingUp
          expr: |
            (
              node_filesystem_files_free{
                fstype!~"tmpfs|overlay|nsfs|squashfs",
                mountpoint!~"/run.*|/var/lib/kubelet/pods/.+"
              }
              /
              node_filesystem_files{
                fstype!~"tmpfs|overlay|nsfs|squashfs",
                mountpoint!~"/run.*|/var/lib/kubelet/pods/.+"
              }
            ) < 0.10
            and
            node_filesystem_readonly{
              fstype!~"tmpfs|overlay|nsfs|squashfs",
              mountpoint!~"/run.*|/var/lib/kubelet/pods/.+"
            } == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node filesystem has less than 10% free inodes.
        # Report nodes running short of available memory.
        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node reports memory pressure.
        # Report nodes under Kubernetes disk pressure.
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Node reports disk pressure.
    - name: baseline.workloads
      rules:
        # Report containers stuck in repeated restart backoff.
        - alert: KubePodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[15m]) >= 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Container keeps entering restart backoff.
        # Check active pods; completed Jobs stay unready.
        - alert: KubePodNotReady
          expr: |
            (kube_pod_status_ready{condition="false"} == 1)
            and on (namespace, pod)
            max by (namespace, pod) (
              kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Active pod has been unready for 15 minutes.
        # Report deployments below their requested replica count.
        - alert: KubeDeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment has fewer available replicas than requested.
        # Report StatefulSets below their requested replica count.
        - alert: KubeStatefulSetReplicasMismatch
          expr: kube_statefulset_replicas > kube_statefulset_status_replicas_ready
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: StatefulSet has fewer ready replicas than requested.
        # Ignore old Jobs with retained failure conditions.
        - alert: KubeJobFailed
          expr: |
            (kube_job_failed{condition="true"} == 1)
            and on (namespace, job_name)
            ((time() - kube_job_created) < 86400)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Job created in the last day has failed.
        # Report containers restarting repeatedly within one hour.
        - alert: ContainerRestartHigh
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Container restarted more than three times in one hour.
    - name: baseline.storage
      rules:
        # Warn about volumes with under 15% free.
        - alert: PersistentVolumeUsageHigh
          expr: |
            (
              kubelet_volume_stats_available_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Persistent volume has less than 15% free space.
        # Warn about volumes with under 5% free.
        - alert: PersistentVolumeAlmostFull
          expr: |
            (
              kubelet_volume_stats_available_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) < 0.05
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Persistent volume has less than 5% free space.
    - name: baseline.postgres
      rules:
        # Warn before the connection limit is reached.
        - alert: PostgresConnectionsHigh
          expr: |
            (
              ccp_connection_stats_total{namespace="infra"}
              /
              ccp_connection_stats_max_connections{namespace="infra"}
            ) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              PostgreSQL connections at {{ $value | humanizePercentage }} (threshold: 80%).
