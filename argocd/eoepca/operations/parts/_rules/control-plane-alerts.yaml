apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: control-plane-alerts
  namespace: operations
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: control-plane.metrics
      interval: 30s
      rules:
        # Average API requests per second over 5m.
        - record: control_plane:apiserver_requests:rate5m
          expr: sum(rate(apiserver_request_total{job="apiserver"}[5m]))
        # Average earlier API traffic, excluding recent spikes.
        - record: control_plane:apiserver_requests:baseline1h
          expr: avg_over_time(control_plane:apiserver_requests:rate5m[1h] offset 10m)
        # Count API requests to etcd per second.
        - record: control_plane:etcd_requests:rate5m
          expr: sum(rate(etcd_request_duration_seconds_count{job="apiserver"}[5m]))
        # Count failed API requests to etcd.
        - record: control_plane:etcd_request_errors:rate5m
          expr: sum(rate(etcd_request_errors_total{job="apiserver"}[5m]))
        # Measure etcd operation p99 over five minutes.
        - record: control_plane:etcd_request_duration_seconds:p99
          expr: |
            histogram_quantile(0.99,
              sum by (le, operation) (
                rate(etcd_request_duration_seconds_bucket{job="apiserver"}[5m])
              )
            )
        # Retain the measured latency when an operation exceeds one second.
        - record: control_plane:etcd_request_duration_seconds:above1s
          expr: control_plane:etcd_request_duration_seconds:p99 > 1
    - name: control-plane.alerts
      rules:
        - alert: KubeAPIRequestSpike
          expr: |
            (control_plane:apiserver_requests:rate5m > 150)
            and
            (control_plane:apiserver_requests:rate5m
              > 2 * clamp_min(control_plane:apiserver_requests:baseline1h, 25))
          for: 5m
          labels:
            severity: warning
            cluster: eoepca-demo
            service: kubernetes-control-plane
            component: kube-apiserver
          annotations:
            summary: Kubernetes API traffic exceeds its earlier baseline.
            description: >-
              Traffic is {{ $value | printf "%.0f" }} requests/sec, above 150 and twice the earlier hourly baseline. The
              baseline needs ten minutes of data.
            dashboard: control-plane
            dashboard_url: &control-plane-dashboard https://monitoring.develop-v2.eoepca.org/d/eoepca-control-plane
            context_snapshot: "true"
        - alert: KubeAPIServerUnavailable
          expr: (max(up{job="apiserver"}) == 0) or absent(up{job="apiserver"})
          for: 2m
          labels:
            severity: critical
            cluster: eoepca-demo
            service: kubernetes-control-plane
            component: kube-apiserver
          annotations:
            summary: Prometheus cannot scrape the Kubernetes API server.
            description: Check the API scrape target and control-plane node.
            dashboard: control-plane
            dashboard_url: *control-plane-dashboard
            context_snapshot: "true"
        - alert: KubeAPIServerErrors
          expr: |
            (
              sum(rate(apiserver_request_total{job="apiserver",code=~"5.."}[5m]))
              / clamp_min(control_plane:apiserver_requests:rate5m, 1)
            ) > 0.01
            and
            sum(rate(apiserver_request_total{job="apiserver",code=~"5.."}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            cluster: eoepca-demo
            service: kubernetes-control-plane
            component: kube-apiserver
          annotations:
            summary: Kubernetes API requests return sustained 5xx errors.
            description: Over 1% of API requests return 5xx, at more than 0.1 errors/sec.
            dashboard: control-plane
            dashboard_url: *control-plane-dashboard
            context_snapshot: "true"
        - alert: EtcdRequestLatencyHigh
          expr: control_plane:etcd_request_duration_seconds:above1s > 1
          labels:
            severity: warning
            cluster: eoepca-demo
            service: kubernetes-control-plane
            component: etcd
          annotations:
            summary: Etcd {{ $labels.operation }} latency exceeds one second.
            description: >-
              The API server reports etcd p99 of {{ $value | humanizeDuration }} over five minutes. Check controller
              requests and node disk write time.
            dashboard: control-plane
            dashboard_url: *control-plane-dashboard
            context_snapshot: "true"
        - alert: EtcdRequestLatencyCritical
          expr: |
            (control_plane:etcd_request_duration_seconds:p99{operation=~"get|update"} > 5)
            and on (operation)
            sum by (operation) (
              rate(etcd_request_duration_seconds_count{job="apiserver",operation=~"get|update"}[5m])
            ) > 1
          for: 2m
          labels:
            severity: critical
            cluster: eoepca-demo
            service: kubernetes-control-plane
            component: etcd
          annotations:
            summary: Etcd {{ $labels.operation }} latency exceeds five seconds.
            description: >-
              The API server reports etcd p99 of {{ $value | humanizeDuration }} . Slow responses can prevent controllers
              from renewing leader leases.
            dashboard: control-plane
            dashboard_url: *control-plane-dashboard
            context_snapshot: "true"
        - alert: EtcdRequestErrors
          expr: control_plane:etcd_request_errors:rate5m > 0.1
          for: 5m
          labels:
            severity: warning
            cluster: eoepca-demo
            service: kubernetes-control-plane
            component: etcd
          annotations:
            summary: API requests to etcd are failing.
            description: API requests to etcd fail at {{ $value | printf "%.2f" }} errors/sec.
            dashboard: control-plane
            dashboard_url: *control-plane-dashboard
            context_snapshot: "true"
