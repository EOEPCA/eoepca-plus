apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-alerts
  namespace: operations
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: security.trivy
      rules:
        - alert: TrivyCriticalImageVulnerabilities
          expr: sum(trivy_image_vulnerabilities{severity="Critical"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Trivy found critical container image vulnerabilities.
            description: Check which image contains the vulnerable package and whether the service uses it.
        - alert: TrivyExposedSecrets
          # Keep High findings on the dashboard only.
          expr: sum(trivy_image_exposedsecrets{severity="Critical"}) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Trivy found critical exposed secrets in container images.
            description: Check the ExposedSecretReport. Rotate valid credentials and remove them from the image.
        - alert: TrivyCriticalConfigurationFindings
          expr: |
            (
              (sum(trivy_resource_configaudits{severity="Critical"}) or vector(0))
              + (sum(trivy_role_rbacassessments{severity="Critical"}) or vector(0))
              + (sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"}) or vector(0))
            ) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Trivy found critical Kubernetes configuration or RBAC findings.
            description: Open the ConfigAuditReport or RbacAssessmentReport for the affected resource.
        - alert: TrivyComplianceChecksFailing
          expr: sum by (title) (trivy_cluster_compliance{status="Fail"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Trivy reports failed {{ $labels.title }} compliance checks.
            description: Check failed controls in the ClusterComplianceReport.
        - alert: TrivyComplianceMetricsMissing
          expr: absent(trivy_cluster_compliance)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Trivy compliance metrics are missing.
            description: Check the Trivy Operator scrape target and ClusterComplianceReports.
