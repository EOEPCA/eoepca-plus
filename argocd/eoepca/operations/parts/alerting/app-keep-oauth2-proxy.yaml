apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keep-oauth2-proxy
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: keep-oauth2-proxy
spec:
  project: eoepca
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.4.2
    helm:
      releaseName: keep-oauth2-proxy
      values: |
        proxyVarsAsSecrets: false
        config:
          requiredSecretKeys: []
          emailDomains:
            - "*"
          cookieName: keep
        alphaConfig:
          enabled: true
          configData:
            providers:
              - id: alerting
                provider: keycloak-oidc
                clientID: ${OAUTH2_PROXY_CLIENT_ID}
                clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
                allowedGroups:
                  - keep_admin
                  - keep_noc
                oidcConfig:
                  issuerURL: https://develop-v2.eoepca.org/iam/auth/realms/eoepca
                scope: openid email profile roles
            upstreamConfig:
              upstreams:
                - id: backend
                  path: /v2/
                  uri: http://keep-backend.operations.svc.cluster.local:8080
                  rewriteTarget: /
                  passHostHeader: true
                - id: websocket
                  path: /websocket/
                  uri: http://keep-websocket.operations.svc.cluster.local:6001
                  rewriteTarget: /
                  passHostHeader: true
                  proxyWebSockets: true
                - id: frontend
                  path: /
                  uri: http://keep-frontend.operations.svc.cluster.local:3000
                  passHostHeader: true
            injectRequestHeaders:
              - name: X-Forwarded-Email
                values:
                  - claimSource:
                      claim: email
              - name: X-Forwarded-Groups
                values:
                  - claimSource:
                      claim: groups
        extraArgs:
          redirect-url: https://alerting.develop-v2.eoepca.org/oauth2/callback
          cookie-secure: "true"
          session-cookie-minimal: "true"
          reverse-proxy: "true"
          skip-provider-button: "true"
        extraEnv:
          - name: OAUTH2_PROXY_CLIENT_ID
            value: alerting
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: alerting-oidc
                key: attribute.client_secret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: keep-oauth2-proxy-cookie
                key: cookie-secret
        service:
          type: ClusterIP
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
  destination:
    name: in-cluster
    namespace: operations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
