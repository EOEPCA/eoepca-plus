apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keep
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: keep
spec:
  project: eoepca
  source:
    repoURL: https://keephq.github.io/helm-charts
    chart: keep
    targetRevision: 0.1.95
    helm:
      releaseName: keep
      values: |
        backend:
          podSecurityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          env:
          - name: AUTH_TYPE
            value: OAUTH2PROXY
          - name: KEEP_OAUTH2_PROXY_USER_HEADER
            value: x-forwarded-email
          - name: KEEP_OAUTH2_PROXY_ROLE_HEADER
            value: x-forwarded-groups
          - name: KEEP_OAUTH2_PROXY_AUTO_CREATE_USER
            value: "true"
          - name: KEEP_OAUTH2_PROXY_ADMIN_ROLES
            value: keep_admin
          - name: KEEP_OAUTH2_PROXY_NOC_ROLES
            value: keep_noc
          - name: KEEP_OAUTH2_PROXY_WEBHOOK_ROLES
            value: keep_webhook
          envFromSecret: keep-auth-secrets
        frontend:
          podSecurityContext:
            fsGroup: 65533
            runAsGroup: 65533
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 65533
            runAsNonRoot: true
            runAsUser: 1001
          env:
          - name: NEXTAUTH_URL
            value: https://alerting.develop-v2.eoepca.org
          - name: NEXTAUTH_URL_INTERNAL
            value: http://keep-frontend.operations.svc.cluster.local:3000
          - name: API_URL_CLIENT
            value: /v2
          - name: API_URL
            value: http://keep-backend.operations.svc.cluster.local:8080
          - name: AUTH_TYPE
            value: OAUTH2PROXY
          - name: KEEP_OAUTH2_PROXY_USER_HEADER
            value: x-forwarded-email
          - name: KEEP_OAUTH2_PROXY_ROLE_HEADER
            value: x-forwarded-groups
        websocket:
          podSecurityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        database:
          mysql:
            image:
              tag: "26.7.0"
          podSecurityContext:
            fsGroup: 999
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
        global:
          ingress:
            enabled: false
  destination:
    name: in-cluster
    namespace: operations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
