apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: alerting
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: alerting-oidc
  forProvider:
    realmId: eoepca
    name: alerting
    accessType: CONFIDENTIAL
    clientId: alerting
    enabled: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    fullScopeAllowed: true
    serviceAccountsEnabled: false
    useRefreshTokens: true
    rootUrl: https://alerting.rke2.deploybox.co.uk
    validRedirectUris:
      - https://alerting.rke2.deploybox.co.uk/oauth2/callback
    validPostLogoutRedirectUris:
      - https://alerting.rke2.deploybox.co.uk/
      - https://alerting.rke2.deploybox.co.uk/oauth2/*
    webOrigins:
      - https://alerting.rke2.deploybox.co.uk
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: alerting-keep-admin
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: keep_admin
    description: Admin access for alerting stack
    clientIdRef:
      name: alerting
      policy:
        resolution: Required
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: alerting-keep-noc
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: keep_noc
    description: NOC access for alerting stack
    clientIdRef:
      name: alerting
      policy:
        resolution: Required
---
apiVersion: role.keycloak.m.crossplane.io/v1alpha1
kind: Role
metadata:
  name: alerting-keep-webhook
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: keep_webhook
    description: Webhook ingestion access for alerting stack
    clientIdRef:
      name: alerting
      policy:
        resolution: Required
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: alerting-client-roles-groups
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: alerting
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-usermodel-client-role-mapper
    name: alerting-client-roles-groups
    config:
      "access.token.claim": "true"
      "id.token.claim": "true"
      "userinfo.token.claim": "true"
      "multivalued": "true"
      "claim.name": "groups"
      "jsonType.label": "String"
      "usermodel.clientRoleMapping.clientId": "alerting"
