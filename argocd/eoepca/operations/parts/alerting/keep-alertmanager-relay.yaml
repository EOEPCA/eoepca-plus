apiVersion: v1
kind: ConfigMap
metadata:
  name: keep-alertmanager-relay-config
  namespace: operations
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8080;

        location = /alerts/event/prometheus {
          proxy_pass http://keep-backend.operations.svc.cluster.local:8080;
          proxy_set_header X-Forwarded-Email webhook@alertmanager;
          proxy_set_header X-Forwarded-Groups keep_webhook;
          proxy_set_header Cookie "";
          proxy_http_version 1.1;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keep-alertmanager-relay
  namespace: operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keep-alertmanager-relay
  template:
    metadata:
      labels:
        app: keep-alertmanager-relay
    spec:
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /run
      volumes:
        - name: config
          configMap:
            name: keep-alertmanager-relay-config
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keep-alertmanager-relay
  namespace: operations
spec:
  selector:
    app: keep-alertmanager-relay
  ports:
    - name: http
      port: 80
      targetPort: http
