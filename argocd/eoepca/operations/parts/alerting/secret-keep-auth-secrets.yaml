apiVersion: v1
kind: Secret
metadata:
  name: keep-auth-secrets
  namespace: operations
type: Opaque
# app-keep.yaml sets backend.envFromSecret: keep-auth-secrets, but no
# manifest ever created it, so keep-backend has been stuck in
# CreateContainerConfigError since this BB was added. AUTH_TYPE=OAUTH2PROXY
# trusts the x-forwarded-email/x-forwarded-groups headers injected by
# keep-oauth2-proxy and needs no secret values of its own (the chart's
# envFromSecret is a generic, schema-less envFrom hook), so an empty secret
# is enough to satisfy the reference and let the pod start.
data: {}
