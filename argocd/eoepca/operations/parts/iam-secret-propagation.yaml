apiVersion: v1
kind: ServiceAccount
metadata:
  name: operations-iam-secret-reader
  namespace: iam-management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operations-iam-secret-reader
  namespace: iam-management
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operations-iam-secret-reader
  namespace: iam-management
subjects:
  - kind: ServiceAccount
    name: operations-iam-secret-reader
    namespace: iam-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operations-iam-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: operations-iam
spec:
  provider:
    kubernetes:
      remoteNamespace: iam-management
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: iam-management
      auth:
        serviceAccount:
          name: operations-iam-secret-reader
          namespace: iam-management
  conditions:
    - namespaces:
        - operations
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerting-oidc
  namespace: operations
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: operations-iam
  target:
    name: alerting-oidc
  dataFrom:
    - extract:
        key: alerting-oidc
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-oidc
  namespace: operations
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: operations-iam
  target:
    name: monitoring-oidc
  dataFrom:
    - extract:
        key: monitoring-oidc
