apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-logs
  namespace: operations
  labels:
    app.kubernetes.io/name: alloy-logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-logs
      annotations:
        eoepca-config-alloy: alloy-logs-config
    spec:
      serviceAccountName: alloy-logs
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoExecute
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: user
          effect: NoSchedule
        - key: hub.jupyter.org_dedicated
          operator: Equal
          value: user
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com_gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: alloy
          image: grafana/alloy:v1.12.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - --stability.level=experimental
            - --disable-reporting=true
            - /etc/alloy/config.alloy
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 12345
              name: http-metrics
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
            - name: rke2-audit
              mountPath: /var/lib/rancher/rke2/server/logs
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: run-journal
              mountPath: /run/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-logs-config
        - name: data
          hostPath:
            path: /var/lib/alloy-logs
            type: DirectoryOrCreate
        - name: rke2-audit
          hostPath:
            path: /var/lib/rancher/rke2/server/logs
            type: DirectoryOrCreate
        - name: journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: run-journal
          hostPath:
            path: /run/log/journal
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
