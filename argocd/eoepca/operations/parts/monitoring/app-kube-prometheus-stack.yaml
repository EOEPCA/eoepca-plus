apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: kube-prometheus-stack
spec:
  project: eoepca
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 83.1.0
    helm:
      values: |
        # CRDs are owned by the early monitoring-crds root Application. Keeping
        # them out of this chart avoids duplicate Argo ownership.
        crds:
          enabled: false

        grafana:
          enabled: true
          defaultDashboardsEnabled: false
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: monitoring-oidc
                key: attribute.client_secret
          grafana.ini:
            server:
              root_url: "https://monitoring.develop-v2.eoepca.org/"
            auth:
              disable_login_form: true
              oauth_auto_login: false
            auth.basic:
              enabled: false
            auth.generic_oauth:
              enabled: true
              name: Login EOEPCA
              allow_sign_up: true
              client_id: monitoring
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid email profile offline_access roles
              auth_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/auth
              token_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/token
              api_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/userinfo
              signout_redirect_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fmonitoring.develop-v2.eoepca.org%2Flogin
              login_attribute_path: preferred_username
              name_attribute_path: name
              email_attribute_path: email
              role_attribute_path: contains(resource_access.monitoring.roles[*], 'grafana_admin') && 'GrafanaAdmin' || contains(resource_access.monitoring.roles[*], 'grafana_editor') && 'Editor' || contains(resource_access.monitoring.roles[*], 'grafana_viewer') && 'Viewer'
              allow_assign_grafana_admin: true
              role_attribute_strict: true
              use_refresh_token: true
              tls_skip_verify_insecure: false
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-stack-gateway.operations.svc.cluster.local
              isDefault: false
              jsonData:
                httpMethod: GET

        defaultRules:
          create: false

        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false

        alertmanager:
          enabled: true
          alertmanagerSpec:
            alertmanagerConfigMatcherStrategy:
              type: None

        prometheus:
          enabled: true
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi

        prometheusAgent:
          enabled: false

        thanosRuler:
          enabled: false

        # Export current security-report state and report freshness.
        # The chart adds CRD discovery permissions when customResourceState is
        # enabled; these extra rules grant read-only access to the selected CRs.
        kube-state-metrics:
          rbac:
            extraRules:
              - apiGroups:
                  - wgpolicyk8s.io
                resources:
                  - policyreports
                verbs:
                  - list
                  - watch
              - apiGroups:
                  - kyverno.io
                resources:
                  - policyexceptions
                verbs:
                  - list
                  - watch
              - apiGroups:
                  - aquasecurity.github.io
                resources:
                  - vulnerabilityreports
                  - configauditreports
                  - exposedsecretreports
                  - rbacassessmentreports
                  - clustercompliancereports
                verbs:
                  - list
                  - watch
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind:
                      group: wgpolicyk8s.io
                      version: v1alpha2
                      kind: PolicyReport
                    metricNamePrefix: security_policyreport
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      report: [metadata, name]
                      resource_kind: [scope, kind]
                      resource_name: [scope, name]
                    metrics:
                      - name: result_info
                        help: Current result stored in a namespaced Kyverno PolicyReport.
                        each:
                          type: Info
                          info:
                            path: [results]
                            labelsFromPath:
                              policy: [policy]
                              rule: [rule]
                              result: [result]
                              severity: [severity]
                      - name: result_timestamp_seconds
                        help: Unix timestamp of a result stored in a namespaced Kyverno PolicyReport.
                        each:
                          type: Gauge
                          gauge:
                            path: [results]
                            valueFrom: [timestamp, seconds]
                            labelsFromPath:
                              policy: [policy]
                              rule: [rule]
                              result: [result]
                              severity: [severity]
                  - groupVersionKind:
                      group: kyverno.io
                      version: v2
                      kind: PolicyException
                    metricNamePrefix: security_policyexception
                    labelsFromPath:
                      exception: [metadata, name]
                      policy: [spec, exceptions, "0", policyName]
                    metrics:
                      - name: match_info
                        help: Namespace and resource kind selected by a Kyverno PolicyException match branch.
                        each:
                          type: Info
                          info:
                            path: [spec, match, any]
                            labelsFromPath:
                              target_namespace: [resources, namespaces, "0"]
                              resource_kind: [resources, kinds, "0"]
                  - groupVersionKind:
                      group: aquasecurity.github.io
                      version: v1alpha1
                      kind: VulnerabilityReport
                    metricNamePrefix: security_trivy_vulnerabilityreport
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      report: [metadata, name]
                      resource_kind: [metadata, labels, trivy-operator.resource.kind]
                      resource_name: [metadata, labels, trivy-operator.resource.name]
                      resource_spec_hash: [metadata, labels, resource-spec-hash]
                    metrics:
                      - name: updated_timestamp_seconds
                        help: Unix update timestamp of a Trivy VulnerabilityReport.
                        each:
                          type: Gauge
                          gauge:
                            path: [report, updateTimestamp]
                  - groupVersionKind:
                      group: aquasecurity.github.io
                      version: v1alpha1
                      kind: ConfigAuditReport
                    metricNamePrefix: security_trivy_configauditreport
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      report: [metadata, name]
                      resource_kind: [metadata, labels, trivy-operator.resource.kind]
                      resource_name: [metadata, labels, trivy-operator.resource.name]
                      resource_spec_hash: [metadata, labels, resource-spec-hash]
                    metrics:
                      - name: updated_timestamp_seconds
                        help: Unix update timestamp of a Trivy ConfigAuditReport.
                        each:
                          type: Gauge
                          gauge:
                            path: [report, updateTimestamp]
                  - groupVersionKind:
                      group: aquasecurity.github.io
                      version: v1alpha1
                      kind: ExposedSecretReport
                    metricNamePrefix: security_trivy_exposedsecretreport
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      report: [metadata, name]
                      resource_kind: [metadata, labels, trivy-operator.resource.kind]
                      resource_name: [metadata, labels, trivy-operator.resource.name]
                      resource_spec_hash: [metadata, labels, resource-spec-hash]
                    metrics:
                      - name: updated_timestamp_seconds
                        help: Unix update timestamp of a Trivy ExposedSecretReport.
                        each:
                          type: Gauge
                          gauge:
                            path: [report, updateTimestamp]
                  - groupVersionKind:
                      group: aquasecurity.github.io
                      version: v1alpha1
                      kind: RbacAssessmentReport
                    metricNamePrefix: security_trivy_rbacassessmentreport
                    labelsFromPath:
                      namespace: [metadata, namespace]
                      report: [metadata, name]
                      resource_kind: [metadata, labels, trivy-operator.resource.kind]
                      resource_name: [metadata, labels, trivy-operator.resource.name]
                      resource_spec_hash: [metadata, labels, resource-spec-hash]
                    metrics:
                      - name: updated_timestamp_seconds
                        help: Unix update timestamp of a Trivy RbacAssessmentReport.
                        each:
                          type: Gauge
                          gauge:
                            path: [report, updateTimestamp]
                  - groupVersionKind:
                      group: aquasecurity.github.io
                      version: v1alpha1
                      kind: ClusterComplianceReport
                    metricNamePrefix: security_trivy_clustercompliancereport
                    labelsFromPath:
                      report: [metadata, name]
                    metrics:
                      - name: updated_timestamp_seconds
                        help: Unix update timestamp of a Trivy ClusterComplianceReport.
                        each:
                          type: Gauge
                          gauge:
                            path: [status, updateTimestamp]

        prometheus-node-exporter:
          hostPort:
            enabled: false
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # Custom CriticalAddonsOnly toleration to allow scheduling on the RKE2 control-plane nodes
          tolerations:
            - effect: NoSchedule
              operator: Exists
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoExecute

        prometheusOperator:
          scrapeConfig:
            enabled: false
  destination:
    name: in-cluster
    namespace: operations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=false
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
