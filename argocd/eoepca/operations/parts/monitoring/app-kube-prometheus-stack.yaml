apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: kube-prometheus-stack
spec:
  project: eoepca
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 83.1.0
    helm:
      values: |
        # CRDs are owned by the early monitoring-crds root Application. Keeping
        # them out of this chart avoids duplicate Argo ownership.
        crds:
          enabled: false

        grafana:
          enabled: true
          defaultDashboardsEnabled: false
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: monitoring-oidc
                key: attribute.client_secret
          grafana.ini:
            server:
              root_url: "https://monitoring.develop-v2.eoepca.org/"
            auth:
              disable_login_form: true
              oauth_auto_login: false
            auth.basic:
              enabled: false
            auth.generic_oauth:
              enabled: true
              name: Login EOEPCA
              allow_sign_up: true
              client_id: monitoring
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid email profile offline_access roles
              auth_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/auth
              token_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/token
              api_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/userinfo
              signout_redirect_url: https://develop-v2.eoepca.org/iam/auth/realms/eoepca/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fmonitoring.develop-v2.eoepca.org%2Flogin
              login_attribute_path: preferred_username
              name_attribute_path: name
              email_attribute_path: email
              role_attribute_path: contains(resource_access.monitoring.roles[*], 'grafana_admin') && 'GrafanaAdmin' || contains(resource_access.monitoring.roles[*], 'grafana_editor') && 'Editor' || contains(resource_access.monitoring.roles[*], 'grafana_viewer') && 'Viewer'
              allow_assign_grafana_admin: true
              role_attribute_strict: true
              use_refresh_token: true
              tls_skip_verify_insecure: false
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-stack-gateway.operations.svc.cluster.local
              isDefault: false
              jsonData:
                httpMethod: GET

        defaultRules:
          create: false

        alertmanager:
          enabled: true
          alertmanagerSpec:
            alertmanagerConfigMatcherStrategy:
              type: None

        prometheus:
          enabled: true
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi

        prometheusAgent:
          enabled: false

        thanosRuler:
          enabled: false

        prometheus-node-exporter:
          hostPort:
            enabled: false

        prometheusOperator:
          scrapeConfig:
            enabled: false
  destination:
    name: in-cluster
    namespace: operations
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: kube-prometheus-stack-admission
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=false
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
