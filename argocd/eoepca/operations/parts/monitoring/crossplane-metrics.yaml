apiVersion: v1
kind: Service
metadata:
  name: crossplane-core-metrics
  namespace: infra
  labels:
    app.kubernetes.io/name: crossplane-core-metrics
spec:
  selector:
    app: crossplane
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: crossplane-core
  namespace: operations
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - infra
  selector:
    matchLabels:
      app.kubernetes.io/name: crossplane-core-metrics
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: crossplane-metrics
        - targetLabel: component
          replacement: crossplane-core
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: crossplane-providers
  namespace: operations
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - infra
  selector:
    matchExpressions:
      - key: pkg.crossplane.io/provider
        operator: Exists
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: crossplane-metrics
        - sourceLabels:
            - __meta_kubernetes_pod_label_pkg_crossplane_io_provider
          targetLabel: component
