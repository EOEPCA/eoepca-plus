# The workspace provider permits collection through the shared environment.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: workspace-managed-data
  namespace: operations
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/managed-by: manual
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: package-r
  podMetricsEndpoints:
    - port: package-r
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
