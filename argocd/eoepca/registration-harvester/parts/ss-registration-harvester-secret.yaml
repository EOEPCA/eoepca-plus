    CDSE_PASSWORD: 
    CDSE_USER: 
    IAM_CLIENT_ID: 
    IAM_CLIENT_SECRET: 
    M2M_PASSWORD: 
    M2M_USER: 
    OPERATON_DB_PASSWORD: 
    OPERATON_DB_USERNAME: 
    OPERATON_REST_PASSWORD: 
    OPERATON_REST_USER: 
  template:
    metadata:
      creationTimestamp: null
      name: registration-harvester-secret
      namespace: registration-harvester-api
