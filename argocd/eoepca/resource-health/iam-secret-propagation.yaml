apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-health-iam-secret-reader
  namespace: iam-management
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-health-iam-secret-reader
  namespace: iam-management
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resource-health-iam-secret-reader
  namespace: iam-management
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
subjects:
  - kind: ServiceAccount
    name: resource-health-iam-secret-reader
    namespace: iam-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resource-health-iam-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: resource-health-iam
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  provider:
    kubernetes:
      remoteNamespace: iam-management
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: iam-management
      auth:
        serviceAccount:
          name: resource-health-iam-secret-reader
          namespace: iam-management
  conditions:
    - namespaces:
        - resource-health
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resource-health-iam-client-credentials
  namespace: resource-health
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: resource-health-iam
  target:
    name: resource-health-iam-client-credentials
  data:
    - secretKey: client_id
      remoteRef:
        key: resource-health-oidc
        property: clientID
    - secretKey: client_secret
      remoteRef:
        key: resource-health-oidc
        property: attribute.client_secret
    - secretKey: session.secret
      remoteRef:
        key: resource-health-session-secret
        property: session.secret
