# resource-health inlines its raw resources directly into the root eoepca
# app (no app-resource-health.yaml -> parts/ split like other BBs), so
# everything here competes in the root app's global wave sequence, not a
# locally-scoped one. Must run after iam (wave 10, creates
# keycloak-provider-config) and after this app's own Client (iam.yaml,
# wave 29) and before the ApisixPluginConfig that consumes the resulting
# secret (wave 32, set in ../kustomization.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-health-iam-secret-reader
  namespace: iam-management
  annotations:
    argocd.argoproj.io/sync-wave: "29"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-health-iam-secret-reader
  namespace: iam-management
  annotations:
    argocd.argoproj.io/sync-wave: "29"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: resource-health-iam-secret-reader
  namespace: iam-management
  annotations:
    argocd.argoproj.io/sync-wave: "29"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
  - kind: ServiceAccount
    name: resource-health-iam-secret-reader
    namespace: iam-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resource-health-iam-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: resource-health-iam
  annotations:
    argocd.argoproj.io/sync-wave: "29"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      remoteNamespace: iam-management
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: iam-management
      auth:
        serviceAccount:
          name: resource-health-iam-secret-reader
          namespace: iam-management
  conditions:
    - namespaces:
        - resource-health
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resource-health-iam-client-credentials
  namespace: resource-health
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: resource-health-iam
  target:
    name: resource-health-iam-client-credentials
  data:
    - secretKey: client_id
      remoteRef:
        key: resource-health-oidc
        property: clientID
    - secretKey: client_secret
      remoteRef:
        key: resource-health-oidc
        property: attribute.client_secret
    - secretKey: session.secret
      remoteRef:
        key: resource-health-session-secret
        property: session.secret
