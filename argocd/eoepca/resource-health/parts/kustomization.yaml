resources:
  - app-resource-health-core.yaml
  - iam.yaml
  - iam-secret-propagation.yaml
  - ingress/ingress.yaml
  - ingress/ingress-auth-plugin.yaml
  - ingress/ingress-browser-auth-plugin.yaml
  - secrets/ss-resource-health-session-secret.yaml
  - secrets/resource-health-notifier-email-sealedsecret.yaml
  - secrets/resource-health-alerting-user-emails-sealedsecret.yaml
  - secrets/resource-health-opensearch-admin-sealedsecret.yaml
  - resource-health-opensearch-admin.yaml


patches:
  - target:
      group: bitnami.com
      kind: SealedSecret
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: external-secrets.io
      kind: ExternalSecret
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          # Needs the Client's connection secret (iam.yaml, default wave 0),
          # the ClusterSecretStore (iam-secret-propagation.yaml, default wave
          # 0), and resource-health-session-secret (a SealedSecret, wave 2)
          # to all exist first, so this has to run after wave 2.
          argocd.argoproj.io/sync-wave: "3"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: user.keycloak.m.crossplane.io
      kind: User
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "4"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: apisix.apache.org
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "4"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true