apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slurm
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: slurm
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  # Wrapper for the Slurm cluster (Slinky). Sync wave is set centrally in
  # argocd/eoepca/kustomization.yaml.
  project: eoepca
  source:
    repoURL: https://github.com/EOEPCA/eoepca-plus
    targetRevision: deploy-develop
    path: argocd/eoepca/slurm/parts
  destination:
    name: in-cluster
    namespace: slurm
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
