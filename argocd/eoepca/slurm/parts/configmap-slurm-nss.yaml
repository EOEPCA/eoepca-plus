# POSIX accounts for slurmctld, mounted over /etc/passwd and /etc/group of the
# slurmctld container (values-slurm.yaml, controller.slurmctld.volumeMounts).
#
# The first block of each file is the unchanged content of the image
# ghcr.io/slinkyproject/slurmctld:26.05.4-ubuntu26.04. Keep it in step with the
# image tag in values-slurm.yaml.
#
# After the image entries: one entry per Slurm user (no comment lines inside
# the files, they are read verbatim). The name must match the Keycloak user
# attribute `slurm_user` (iam.yaml), which the client `slurm-cli` puts into the
# token claim `sun`. Home is /tmp because the workers have no home directories.
apiVersion: v1
kind: ConfigMap
metadata:
  name: slurm-nss
  namespace: slurm
data:
  passwd: |
    root:x:0:0:root:/root:/bin/bash
    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
    bin:x:2:2:bin:/bin:/usr/sbin/nologin
    sys:x:3:3:sys:/dev:/usr/sbin/nologin
    sync:x:4:65534:sync:/bin:/bin/sync
    games:x:5:60:games:/usr/games:/usr/sbin/nologin
    man:x:6:12:man:/var/cache/man:/usr/sbin/nologin
    lp:x:7:7:lp:/var/spool/lpd:/usr/sbin/nologin
    mail:x:8:8:mail:/var/mail:/usr/sbin/nologin
    news:x:9:9:news:/var/spool/news:/usr/sbin/nologin
    uucp:x:10:10:uucp:/var/spool/uucp:/usr/sbin/nologin
    proxy:x:13:13:proxy:/bin:/usr/sbin/nologin
    www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
    backup:x:34:34:backup:/var/backups:/usr/sbin/nologin
    list:x:38:38:Mailing List Manager:/var/list:/usr/sbin/nologin
    irc:x:39:39:ircd:/run/ircd:/usr/sbin/nologin
    _apt:x:42:65534::/nonexistent:/usr/sbin/nologin
    nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin
    slurm:x:401:401::/home/slurm:/usr/sbin/nologin
    sssd:x:100:101:SSSD system user:/var/lib/sss:/usr/sbin/nologin
    slurm-test-1:x:3101:3101:Slurm test user 1:/tmp:/bin/bash
    slurm-test-2:x:3102:3102:Slurm test user 2:/tmp:/bin/bash
  group: |
    root:x:0:
    daemon:x:1:
    bin:x:2:
    sys:x:3:
    adm:x:4:
    tty:x:5:
    disk:x:6:
    lp:x:7:
    mail:x:8:
    news:x:9:
    uucp:x:10:
    man:x:12:
    proxy:x:13:
    kmem:x:15:
    dialout:x:20:
    fax:x:21:
    voice:x:22:
    cdrom:x:24:
    floppy:x:25:
    tape:x:26:
    sudo:x:27:
    audio:x:29:
    dip:x:30:
    www-data:x:33:
    backup:x:34:
    operator:x:37:
    list:x:38:
    irc:x:39:
    src:x:40:
    shadow:x:42:
    utmp:x:43:
    video:x:44:
    sasl:x:45:
    plugdev:x:46:
    staff:x:50:
    games:x:60:
    users:x:100:
    nogroup:x:65534:
    slurm:x:401:
    sssd:x:101:
    slurm-test-1:x:3101:
    slurm-test-2:x:3102:
