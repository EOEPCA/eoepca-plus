resources:
  - app-slurm-core.yaml
  - ss-slurm-auth-key.yaml
  - ss-slurm-auth-jwt.yaml
  - configmap-slurm-nss.yaml
  - cronjob-slurm-jwks-refresh.yaml
  - deployment-synthetic-slurm-check.yaml
  - iam.yaml
  - ss-slurm-test-users.yaml

configMapGenerator:
  - name: synthetic-slurm-check-script
    namespace: slurm
    files:
      - check-slurm.sh=synthetic-slurm-check/check-slurm.sh
  - name: slurm-jwks-refresh-script
    namespace: slurm
    options:
      disableNameSuffixHash: true
    files:
      - refresh-jwks.sh=slurm-jwks-refresh/refresh-jwks.sh

# Keycloak objects (Crossplane, namespace iam-management): the test-user
# password Secret first, then client, mapper and users. Same waves as other
# building blocks, e.g. resource-health.
patches:
  - target:
      group: bitnami.com
      kind: SealedSecret
      name: slurm-test-users
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      group: .*keycloak.m.crossplane.io
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "4"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
