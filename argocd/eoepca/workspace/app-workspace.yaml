apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: workspace
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  sources:
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      path: argocd/eoepca/workspace/parts
  destination:
    name: in-cluster
    namespace: workspace
  # Kyverno's admission controller fills in emitWarning/validationFailureAction/
  # skipBackgroundRequests defaults the manifests don't set, which otherwise
  # shows as permanent drift.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - '.spec.emitWarning'
        - '.spec.validationFailureAction'
        - '.spec.rules[].skipBackgroundRequests'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
