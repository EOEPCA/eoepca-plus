apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-admin
  namespace: argocd
  labels:
    eoepca/app-name: workspace-admin
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    # The archived project's GitHub Pages Helm index now returns 404. The
    # tagged chart source remains available from the official repository.
    repoURL: https://github.com/kubernetes/dashboard.git
    targetRevision: kubernetes-dashboard-7.10.1
    path: charts/kubernetes-dashboard
    helm:
      releaseName: workspace-admin
      valuesObject:
        fullnameOverride: workspace-admin
        kong:
         admin:
          tls:
            enabled: false
        app:
          ingress:
            enabled: false
  destination:
    name: in-cluster
    namespace: workspace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
