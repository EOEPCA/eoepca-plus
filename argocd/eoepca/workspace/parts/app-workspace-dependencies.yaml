apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-dependencies
  namespace: argocd
  labels:
    eoepca/app-name: workspace-dependencies
spec:
  project: eoepca
  sources:
    - repoURL: ghcr.io/eoepca/workspace
      chart: workspace-dependencies-csi-rclone
      targetRevision: 2.2.0
      helm:
        releaseName: workspace-dependencies-csi-rclone
    - repoURL: ghcr.io/eoepca/workspace
      chart: workspace-dependencies-educates
      targetRevision: 2.2.0
      helm:
        releaseName: workspace-dependencies-educates
        values: |
          clusterIngressDomain: lab.develop-v2.eoepca.org
          clusterIngressClass: apisix
          tlsCertificateRef:
            name: workspace-tls
            namespace: workspace
  destination:
    name: in-cluster
    namespace: workspace
  # The educates.dev CRDs (vendored, not authored here) omit
  # additionalPrinterColumns[].priority; the API server defaults it to 0 on
  # write, which then perpetually shows as OutOfSync against the git source.
  # That OutOfSync state also propagates up through the custom Application
  # health check, so this app (and the root eoepca app) never show Healthy.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.versions[].additionalPrinterColumns[].priority
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: educates-session-manager
      jsonPointers:
        - /rules
  syncPolicy:
    automated:
      prune: false # never prune
      selfHeal: false # only manual sync
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
