apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-oauth2-proxy
  namespace: argocd
  labels:
    eoepca/app-name: workspace-oauth2-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  project: eoepca
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 10.4.2
    helm:
      releaseName: workspace-oauth2-proxy
      values: |
        proxyVarsAsSecrets: false
        config:
          requiredSecretKeys: []
          emailDomains:
            - "*"
          cookieName: workspace
        alphaConfig:
          enabled: true
          configData:
            providers:
              - id: workspace
                provider: keycloak-oidc
                clientID: ${OAUTH2_PROXY_CLIENT_ID}
                clientSecret: ${OAUTH2_PROXY_CLIENT_SECRET}
                oidcConfig:
                  issuerURL: https://iam-auth.develop.eoepca.org/realms/eoepca
                scope: openid email profile roles
            upstreamConfig:
              upstreams:
                - id: workspace-api
                  path: /
                  uri: http://workspace-api.workspace.svc.cluster.local:8080
            injectRequestHeaders:
              - name: X-Forwarded-Email
                values:
                  - claimSource:
                      claim: email
              - name: X-Forwarded-Groups
                values:
                  - claimSource:
                      claim: groups
        extraArgs:
          redirect-url: https://auth.ngx.develop.eoepca.org/oauth2/callback
          cookie-secure: "true"
          cookie-domain: .ngx.develop.eoepca.org
          whitelist-domain: .ngx.develop.eoepca.org
          session-cookie-minimal: "true"
          reverse-proxy: "true"
          skip-provider-button: "true"
        extraEnv:
          - name: OAUTH2_PROXY_CLIENT_ID
            value: workspace-oauth2-proxy
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: workspace-oauth2-proxy-oidc
                key: attribute.client_secret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: workspace-oauth2-proxy-cookie
                key: cookie-secret
        ingress:
          enabled: true
          annotations:
            nginx.ingress.kubernetes.io/configuration-snippet: |
              set $cors_origin "";
              if ($http_origin ~* "^https://.*\\.ngx\\.develop\\.eoepca\\.org$") {
                set $cors_origin $http_origin;
              }
              if ($http_origin = "https://workspace-api.develop.eoepca.org") {
                set $cors_origin $http_origin;
              }
              if ($http_origin = "null") {
                set $cors_origin "null";
              }
              add_header Access-Control-Allow-Origin $cors_origin always;
              add_header Access-Control-Allow-Credentials "true" always;
              add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, PATCH, OPTIONS" always;
              add_header Access-Control-Allow-Headers "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
              add_header Access-Control-Max-Age "1728000" always;
              if ($request_method = OPTIONS) {
                return 204;
              }
          className: nginx
          path: /oauth2
          pathType: Prefix
          hosts:
            - auth.ngx.develop.eoepca.org
          tls:
            - hosts:
                - auth.ngx.develop.eoepca.org
              secretName: workspace-tls
        service:
          type: ClusterIP
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
  destination:
    name: in-cluster
    namespace: workspace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
