apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-pipeline
  namespace: argocd
  labels:
    eoepca/app-name: workspace-pipeline
spec:
  project: eoepca
  sources:
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop
      path: argocd/eoepca/workspace/pipeline
  destination:
    name: in-cluster
    namespace: workspace
  syncPolicy:
    automated:
      prune: false # never prune
      selfHeal: false # only manual sync
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
