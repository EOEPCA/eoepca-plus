apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-pipeline
  namespace: argocd
  labels:
    eoepca/app-name: workspace-pipeline
spec:
  project: eoepca
  sources:
    - repoURL: ghcr.io/eoepca/workspace
      chart: workspace-pipeline
      targetRevision: 2.3.0
      helm:
        releaseName: workspace-pipeline
        values: |
          storage:
            name: storage-minio
            package: ghcr.io/versioneer-tech/provider-storage/minio:0.4.0-rc.2
            annotations:
              argocd.argoproj.io/sync-wave: "100"
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          datalab:
            package: ghcr.io/versioneer-tech/provider-datalab:0.12.0-rc.3
            annotations:
              argocd.argoproj.io/sync-wave: "100"
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          environmentconfig:
            annotations:
              argocd.argoproj.io/sync-wave: "100"
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
            iam:
              realm: eoepca
              namespace: iam
              issuerURL: https://develop-v2.eoepca.org/iam/auth/realms/eoepca
              internalURL: http://iam-core-keycloak-operator-service.iam.svc.cluster.local:8080/realms/eoepca
              extraAudiences:
                - workspace-api
            ingress:
              enabled: false
              class: apisix
              domain: lab.develop-v2.eoepca.org
              secret: workspace-tls
            httpRoute:
              enabled: true
              enableS3: true
              parentName: eoepca-public
              parentNamespace: gateway
              sectionName: workspaces-https
              httpSectionName: http
            storage:
              endpoint: https://minio.develop-v2.eoepca.org
              forcePathStyle: "true"
              provider: Other
              region: eoepca-demo
              secretNamespace: workspace
              type: s3
            network:
              internalIngress:
                - namespace: operations
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
                      prometheus: kube-prometheus-stack-prometheus
                  targetPodSelector:
                    matchLabels:
                      app.kubernetes.io/name: package-r
                  ports:
                    - protocol: TCP
                      port: 8888
              internalEgress:
                - namespace: iam
                  podSelector:
                    matchLabels:
                      app: keycloak
                      app.kubernetes.io/instance: iam-core-keycloak-operator
                      app.kubernetes.io/managed-by: keycloak-operator
                  ports:
                    - protocol: TCP
                      port: 8080
              externalEgressCIDRs:
                - "0.0.0.0/0"
                - "::/0"
              serviceCIDR: "10.43.0.0/16"
              podCIDRs:
                - "10.42.0.0/16"
              blacklistIPs:
                - "169.254.169.254/32"
            packages:
              - name: awscli
                files:
                  - image:
                      url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
              - name: rclone
                files:
                  - image:
                      url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
            defaults:
              quota:
                storage: 8Gi
                budget: x-large
              overallQuota:
                storage: 30Gi
            vcluster:
              storage: 3Gi
              storageClasses:
                allowed:
                  - managed-nfs-storage-retain
              backingStore:
                database:
                  embedded:
                    enabled: true
                    dataSource: "sqlite:///data/state.db?_journal=TRUNCATE&_locking=NORMAL&cache=shared&_busy_timeout=30000&_txlock=immediate&_synchronous=FULL"
                    extraArgs:
                      - --datastore-max-open-connections=2
                      - --datastore-max-idle-connections=1
            database:
              tlsRoute:
                parentName: eoepca-public
                parentNamespace: gateway
                sectionName: https
  destination:
    name: in-cluster
    namespace: workspace
  syncPolicy:
    automated:
      prune: false # never prune
      selfHeal: false # only manual sync
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
