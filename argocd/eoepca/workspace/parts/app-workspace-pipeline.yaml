apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-pipeline
  namespace: argocd
  labels:
    eoepca/app-name: workspace-pipeline
spec:
  project: eoepca
  sources:
    - repoURL: ghcr.io/eoepca/workspace
      chart: workspace-pipeline
      targetRevision: 2.2.3
      helm:
        releaseName: workspace-pipeline
        values: |
          storage:
            name: storage-minio
            package: ghcr.io/versioneer-tech/provider-storage/minio:0.4.0-rc.2
            annotations:
              argocd.argoproj.io/sync-wave: "100"
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          datalab:
            package: ghcr.io/versioneer-tech/provider-datalab/educates:0.11.0-rc.1
            annotations:
              argocd.argoproj.io/sync-wave: "100"
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
          environmentconfig:
            annotations:
              argocd.argoproj.io/sync-wave: "100"
              argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
            iam:
              realm: eoepca
              namespace: iam
              issuerURL: https://develop-v2.eoepca.org/iam/auth/realms/eoepca
              internalURL: http://iam-core-keycloak-operator-service.iam.svc.cluster.local:8080/realms/eoepca
              extraAudiences:
                - workspace-api
            ingress:
              enabled: false
              class: apisix
              domain: lab.develop-v2.eoepca.org
              secret: workspace-tls
            httpRoute:
              enabled: true
              enableS3: true
              parentName: eoepca-public
              parentNamespace: gateway
              sectionName: workspaces-https
              httpSectionName: http
            storage:
              endpoint: https://minio.develop-v2.eoepca.org
              forcePathStyle: true
              provider: Other
              region: eoepca-demo
              secretNamespace: workspace
              type: s3
              lifecycle:
                schedule: ""
            storageClasses:
              allowed: []
            network:
              internalEgress:
                - namespace: iam
                  podSelector:
                    matchLabels:
                      app: keycloak
                      app.kubernetes.io/instance: iam-core-keycloak-operator
                      app.kubernetes.io/managed-by: keycloak-operator
                  ports:
                    - protocol: TCP
                      port: 8080
              externalEgressCIDRs:
                - "0.0.0.0/0"
                - "::/0"
              serviceCIDR: "10.43.0.0/16"
              podCIDRs:
                - "10.42.0.0/16"
              blacklistIPs:
                - "169.254.169.254/32"
            packages:
              - name: awscli
                files:
                  - image:
                      url: ghcr.io/versioneer-tech/educates-extension-packages/awscli:v2.29.0
              - name: rclone
                files:
                  - image:
                      url: ghcr.io/versioneer-tech/educates-extension-packages/rclone:v1.71.0
            defaults:
              overallQuota:
                storage: 100Gi
              quota:
                memory: 2Gi
                storage: 8Gi
                budget: x-large
              security:
                policy: baseline
                kubernetesAccess: true
                kubernetesRole: edit
                externalEgress: true
            database:
              tlsRoute:
                parentName: eoepca-public
                parentNamespace: gateway
                sectionName: https
              storageClassName: ""
              backupStorageClassName: ""
            mongodb:
              storageClassName: ""
            redis:
              storageClassName: ""
            qdrant:
              storageClassName: ""
  destination:
    name: in-cluster
    namespace: workspace
  syncPolicy:
    automated:
      prune: false # never prune
      selfHeal: false # only manual sync
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
