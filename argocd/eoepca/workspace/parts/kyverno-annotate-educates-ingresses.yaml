apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: annotate-educates-ingresses
  annotations:
    argocd.argoproj.io/sync-wave: "110"
spec:
  admission: true
  background: false
  rules:
    - name: add-oauth2-proxy-annotations-for-workspace-ingresses
      match:
        any:
          - resources:
              kinds:
                - Ingress
              selector:
                matchLabels:
                  training.educates.dev/application: workshop
                  training.educates.dev/component: session
      preconditions:
        all:
          - key: "{{ request.object.spec.ingressClassName || '' }}"
            operator: Equals
            value: nginx
          - key: "{{ (request.object.spec.rules || [])[?host != null && ends_with(host, '.ngx.develop.eoepca.org')] | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" || '' }}"
            operator: NotEquals
            value: ""
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              nginx.ingress.kubernetes.io/auth-response-headers: Authorization,X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups
              nginx.ingress.kubernetes.io/auth-signin: https://auth.ngx.develop.eoepca.org/oauth2/start?rd=https://$host$request_uri
              nginx.ingress.kubernetes.io/auth-url: "http://workspace-oauth2-proxy.workspace.svc.cluster.local/oauth2/auth?allowed_groups=role:{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" }}:ws_access,role:{{ request.object.metadata.labels.\"training.educates.dev/environment.name\" }}:ws_admin"
              nginx.ingress.kubernetes.io/configuration-snippet: |
                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header Set-Cookie $auth_cookie;
              nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
              nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
              nginx.ingress.kubernetes.io/proxy-busy-buffers-size: 32k
