apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-cloudferro-environments
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [apiextensions.crossplane.io]
    resources: [environmentconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-cloudferro-projects
  namespace: workspace
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups: [openstack.m.crossplane.io]
    resources: [providerconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-cloudferro-projects
  namespace: workspace
  annotations:
    argocd.argoproj.io/sync-wave: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-cloudferro-projects
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-cloudferro-observation
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  # The policy uses encrypted GitOps input instead of reading Secret data.
  - apiGroups: [bitnami.com]
    resources: [sealedsecrets]
    verbs: [get, list, watch]
