# storage-minio owns the shared Storage XRD. These resources add CloudFerro
# support without installing a second Configuration for the same XRD.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-cloudferro
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - aws.m.upbound.io
    resources:
      - providerconfigs
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-cloudferro
  annotations:
    argocd.argoproj.io/sync-wave: "10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-cloudferro
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: infra
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: storage-cloudferro
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
data:
  storage:
    endpoint: https://s3.waw3-2.cloudferro.com
    force_path_style: "true"
    provider: Other
    region: WAW3-2
    s3Region: RegionOne
    type: s3
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: storage-cloudferro
  labels:
    provider: cloudferro
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  compositeTypeRef:
    apiVersion: pkg.internal/v1beta1
    kind: Storage
  mode: Pipeline
  pipeline:
    - step: load-storage-environment
      functionRef:
        name: crossplane-contrib-function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          from crossplane.function import request, response, resource
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1
          from google.protobuf import json_format

          ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"

          def to_dict(value):
              return {} if value is None else (value if isinstance(value, dict) else json_format.MessageToDict(value, preserving_proto_field_name=True))

          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              xr = to_dict(req.observed.composite.resource)
              metadata = xr.get("metadata") or {}
              annotations = metadata.get("annotations") or {}
              labels = metadata.get("labels") or {}
              env_name = (
                  annotations.get("storages.pkg.internal/environment")
                  or labels.get("storages.pkg.internal/environment")
                  or "storage-cloudferro"
              ).strip() or "storage-cloudferro"
              response.require_resources(
                  rsp,
                  name="storage-environment",
                  api_version="apiextensions.crossplane.io/v1beta1",
                  kind="EnvironmentConfig",
                  match_name=env_name,
              )
              environment = request.get_required_resource(req, "storage-environment") or {}
              data = environment.get("data") or {}
              rsp.context.MergeFrom(resource.dict_to_struct({ENVIRONMENT_KEY: data}))
    - step: create-project-resources
      functionRef:
        name: crossplane-contrib-function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          import re
          from datetime import datetime, timedelta, timezone

          from crossplane.function import response
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1
          from google.protobuf import json_format

          ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"
          PROJECT_ID_ANNOTATION = "storages.pkg.internal/cloudferro-project-id"
          def to_dict(value):
              return {} if value is None else (value if isinstance(value, dict) else json_format.MessageToDict(value, preserving_proto_field_name=True))

          def rollover_suffixes(spec):
              config = spec.get("credentialsRollover") or {}
              interval = (config.get("interval") or "none").strip().lower()
              count = max(1, min(10, int(config.get("maxToKeep") or 1)))
              now = datetime.now(timezone.utc)
              if interval == "daily":
                  dates = [(now - timedelta(days=i)).strftime("%Y%m%d") for i in range(count)]
              elif interval == "weekly":
                  dates = []
                  for i in range(count):
                      week = (now - timedelta(weeks=i)).isocalendar()
                      dates.append(f"{week.year}w{week.week:02d}")
              elif interval == "monthly":
                  dates = [f"{(now.year * 12 + now.month - 1 - i) // 12}{((now.year * 12 + now.month - 1 - i) % 12) + 1:02d}" for i in range(count)]
              elif interval == "quarterly":
                  quarter = now.year * 4 + (now.month - 1) // 3
                  dates = [f"{(quarter - i) // 4}q{((quarter - i) % 4) + 1}" for i in range(count)]
              elif interval == "yearly":
                  dates = [str(now.year - i) for i in range(count)]
              else:
                  return [""]
              return ["-" + date for date in dates]

          def managed(rsp, key, api_version, kind, name, namespace, provider_config_name, for_provider, **fields):
              rsp.desired.resources[key].resource.update({
                  "apiVersion": api_version,
                  "kind": kind,
                  "metadata": {
                      "name": name,
                      "namespace": namespace,
                      "annotations": {"crossplane.io/composition-resource-name": key},
                  },
                  "spec": {
                      "forProvider": for_provider,
                      "providerConfigRef": {"name": provider_config_name, "kind": "ProviderConfig"},
                      **fields,
                  },
              })

          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              xr = to_dict(req.observed.composite.resource)
              metadata = xr.get("metadata") or {}
              spec = xr.get("spec") or {}
              namespace = metadata.get("namespace") or "default"
              principal = (spec.get("principal") or metadata.get("name") or "").strip()
              project_id = ((metadata.get("annotations") or {}).get(PROJECT_ID_ANNOTATION) or "").strip()
              env = (to_dict(req.context).get(ENVIRONMENT_KEY) or {}).get("storage") or {}
              region = (env.get("region") or "").strip()
              s3_region = (env.get("s3Region") or "").strip()
              if (not principal or not re.fullmatch(r"[0-9a-f]{32}", project_id) or
                      not region or not s3_region):
                  response.fatal(rsp, "CloudFerro environment or project ID annotation is incomplete or invalid.")
                  return
              selected_provider = (((spec.get("crossplane") or {}).get("compositionSelector") or {}).get("matchLabels") or {}).get("provider")
              if selected_provider != "cloudferro":
                  response.fatal(rsp, "CloudFerro Storage must select provider cloudferro.")
                  return

              provider_config_name = f"cloudferro-{principal}"
              provider_config_key = "provider-config-openstack"
              rsp.desired.resources[provider_config_key].ready = fnv1.READY_TRUE
              rsp.desired.resources[provider_config_key].resource.update({
                  "apiVersion": "openstack.m.crossplane.io/v1beta1",
                  "kind": "ProviderConfig",
                  "metadata": {
                      "name": provider_config_name,
                      "namespace": namespace,
                      "annotations": {"crossplane.io/composition-resource-name": provider_config_key},
                  },
                  "spec": {"credentials": {"source": "Secret", "secretRef": {
                      "name": f"cloudferro-project-{project_id}",
                      "namespace": namespace,
                      "key": "config",
                  }}},
              })

              own_buckets = sorted({(b.get("bucketName") or "").strip() for b in (spec.get("buckets") or []) if (b.get("bucketName") or "").strip()})
              for bucket in own_buckets:
                  managed(rsp, f"bucket-{bucket}", "objectstorage.openstack.m.crossplane.io/v1alpha1", "ContainerV1", bucket, namespace, provider_config_name, {
                      "name": bucket,
                      "region": region,
                      "forceDestroy": False,
                  })

              for suffix in rollover_suffixes(spec):
                  generation = f"{principal}{suffix}"
                  managed(rsp, f"credentials-{generation}", "identity.openstack.m.crossplane.io/v1alpha1", "EC2CredentialV3", generation, namespace, provider_config_name, {
                      "region": region,
                  }, writeConnectionSecretToRef={"name": f"{generation}-credentials"})
    - step: publish-current-secret
      functionRef:
        name: crossplane-contrib-function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          import base64
          from datetime import datetime, timezone

          from crossplane.function import request, response
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1
          from google.protobuf import json_format

          ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"

          def to_dict(value):
              return {} if value is None else (value if isinstance(value, dict) else json_format.MessageToDict(value, preserving_proto_field_name=True))

          def current_suffix(spec):
              interval = ((spec.get("credentialsRollover") or {}).get("interval") or "none").strip().lower()
              now = datetime.now(timezone.utc)
              if interval == "daily":
                  return "-" + now.strftime("%Y%m%d")
              if interval == "weekly":
                  week = now.isocalendar()
                  return f"-{week.year}w{week.week:02d}"
              if interval == "monthly":
                  return "-" + now.strftime("%Y%m")
              if interval == "quarterly":
                  return f"-{now.year}q{(now.month - 1) // 3 + 1}"
              if interval == "yearly":
                  return "-" + str(now.year)
              return ""

          def encoded(value):
              return base64.b64encode(value.encode("utf-8")).decode("ascii")

          def decoded(value):
              if not isinstance(value, str) or not value:
                  return None
              try:
                  return base64.b64decode(value, validate=True).decode("utf-8")
              except (ValueError, UnicodeError):
                  return None

          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              xr = to_dict(req.observed.composite.resource)
              metadata = xr.get("metadata") or {}
              spec = xr.get("spec") or {}
              namespace = metadata.get("namespace") or "default"
              principal = (spec.get("principal") or metadata.get("name") or "").strip()
              generation = f"{principal}{current_suffix(spec)}"
              env = (to_dict(req.context).get(ENVIRONMENT_KEY) or {}).get("storage") or {}
              endpoint = (env.get("endpoint") or "").strip()
              region = (env.get("s3Region") or "").strip()
              if not principal or not endpoint or not region:
                  return
              secret_key = f"credential-secret-{principal}"
              response.require_resources(
                  rsp,
                  name=secret_key,
                  api_version="v1",
                  kind="Secret",
                  namespace=namespace,
                  match_name=f"{generation}-credentials",
              )
              credential = req.observed.resources.get(f"credentials-{generation}")
              secret = request.get_required_resource(req, secret_key)
              if credential is None or secret is None:
                  return
              credential_data = to_dict(credential.resource)
              access = (((credential_data.get("status") or {}).get("atProvider") or {}).get("access"))
              secret_data = secret.get("data") or {}
              if not isinstance(access, str) or not access or not isinstance(secret_data, dict):
                  return
              source_secret = decoded(secret_data.get("attribute.secret") or secret_data.get("secret"))
              if not source_secret:
                  return
              data = {
                  "AWS_ACCESS_KEY_ID": encoded(access),
                  "AWS_SECRET_ACCESS_KEY": encoded(source_secret),
                  "AWS_ENDPOINT_URL": encoded(endpoint),
                  "AWS_REGION": encoded(region),
                  "AWS_S3_FORCE_PATH_STYLE": encoded("true"),
              }
              key = f"secret-{principal}"
              rsp.desired.resources[key].resource.update({
                  "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                  "kind": "Object",
                  "metadata": {"name": key, "namespace": namespace,
                               "annotations": {"crossplane.io/composition-resource-name": key}},
                  "spec": {
                      "forProvider": {"manifest": {"apiVersion": "v1", "kind": "Secret",
                                                  "metadata": {"name": principal, "namespace": namespace},
                                                  "type": "Opaque", "data": data}},
                      "providerConfigRef": {"name": "provider-kubernetes", "kind": "ProviderConfig"},
                  },
              })
              provider_secret = f"{principal}-cloudferro-aws"
              credentials = "\n".join([
                  "[default]",
                  f"aws_access_key_id={access}",
                  f"aws_secret_access_key={source_secret}",
                  "",
              ])
              secret_key = f"aws-provider-secret-{principal}"
              rsp.desired.resources[secret_key].resource.update({
                  "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                  "kind": "Object",
                  "metadata": {"name": secret_key, "namespace": namespace,
                               "annotations": {"crossplane.io/composition-resource-name": secret_key}},
                  "spec": {
                      "forProvider": {"manifest": {"apiVersion": "v1", "kind": "Secret",
                                                    "metadata": {"name": provider_secret, "namespace": namespace},
                                                    "type": "Opaque",
                                                    "data": {"credentials": encoded(credentials)}}},
                      "providerConfigRef": {"name": "provider-kubernetes", "kind": "ProviderConfig"},
                  },
              })
              provider_key = f"aws-provider-config-{principal}"
              provider_name = f"cloudferro-s3-{principal}"
              rsp.desired.resources[provider_key].resource.update({
                  "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                  "kind": "Object",
                  "metadata": {"name": provider_name, "namespace": namespace,
                               "annotations": {"crossplane.io/composition-resource-name": provider_key}},
                  "spec": {
                      "forProvider": {"manifest": {
                          "apiVersion": "aws.m.upbound.io/v1beta1",
                          "kind": "ProviderConfig",
                          "metadata": {"name": provider_name, "namespace": namespace},
                          "spec": {
                              "credentials": {"source": "Secret", "secretRef": {
                                  "name": provider_secret, "namespace": namespace, "key": "credentials"}},
                              "endpoint": {
                                  "url": {"type": "Static", "static": endpoint},
                                  "services": ["s3"],
                                  "source": "Custom",
                                  "hostnameImmutable": True,
                                  "signingName": "s3",
                                  "signingRegion": region,
                              },
                              "s3_use_path_style": True,
                              "skip_credentials_validation": True,
                              "skip_metadata_api_check": True,
                              "skip_region_validation": True,
                              "skip_requesting_account_id": True,
                          },
                      }},
                      "readiness": {"policy": "SuccessfulCreate"},
                      "providerConfigRef": {"name": "provider-kubernetes", "kind": "ProviderConfig"},
                  },
              })
              usage_key = f"usage-aws-provider-{principal}"
              rsp.desired.resources[usage_key].ready = fnv1.READY_TRUE
              rsp.desired.resources[usage_key].resource.update({
                  "apiVersion": "protection.crossplane.io/v1beta1",
                  "kind": "Usage",
                  "metadata": {"name": usage_key, "namespace": namespace,
                               "annotations": {"crossplane.io/composition-resource-name": usage_key}},
                  "spec": {
                      "replayDeletion": True,
                      "of": {
                          "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                          "kind": "Object",
                          "resourceRef": {"name": secret_key},
                      },
                      "by": {
                          "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                          "kind": "Object",
                          "resourceRef": {"name": provider_name},
                      },
                  },
              })
    - step: create-bucket-policies
      functionRef:
        name: crossplane-contrib-function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          import json
          import re
          from datetime import datetime, timezone

          from crossplane.function import request, response
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1
          from google.protobuf import json_format

          def to_dict(value):
              return {} if value is None else (value if isinstance(value, dict) else json_format.MessageToDict(value, preserving_proto_field_name=True))

          def current_suffix(spec):
              interval = ((spec.get("credentialsRollover") or {}).get("interval") or "none").strip().lower()
              now = datetime.now(timezone.utc)
              if interval == "daily":
                  return "-" + now.strftime("%Y%m%d")
              if interval == "weekly":
                  week = now.isocalendar()
                  return f"-{week.year}w{week.week:02d}"
              if interval == "monthly":
                  return "-" + now.strftime("%Y%m")
              if interval == "quarterly":
                  return f"-{now.year}q{(now.month - 1) // 3 + 1}"
              if interval == "yearly":
                  return "-" + str(now.year)
              return ""

          def statements(bucket, project_id, permission):
              principal = {"AWS": f"arn:aws:iam::{project_id}:root"}
              bucket_actions = ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"]
              object_actions = ["s3:ListMultipartUploadParts"]
              if permission in ("ReadOnly", "ReadWrite"):
                  object_actions.append("s3:GetObject")
              if permission in ("WriteOnly", "ReadWrite"):
                  object_actions.extend(["s3:AbortMultipartUpload", "s3:DeleteObject", "s3:PutObject"])
              return [
                  {"Effect": "Allow", "Principal": principal, "Action": sorted(bucket_actions),
                   "Resource": f"arn:aws:s3:::{bucket}"},
                  {"Effect": "Allow", "Principal": principal, "Action": sorted(object_actions),
                   "Resource": f"arn:aws:s3:::{bucket}/*"},
              ]

          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              xr = to_dict(req.observed.composite.resource)
              metadata = xr.get("metadata") or {}
              spec = xr.get("spec") or {}
              namespace = metadata.get("namespace") or "default"
              principal = (spec.get("principal") or metadata.get("name") or "").strip()
              generation = f"{principal}{current_suffix(spec)}"
              own_buckets = {(item.get("bucketName") or "").strip()
                             for item in (spec.get("buckets") or []) if (item.get("bucketName") or "").strip()}
              active = [grant for grant in (spec.get("bucketAccessGrants") or [])
                        if (grant.get("bucketName") or "").strip() in own_buckets and
                        (grant.get("grantee") or "").strip() and
                        (grant.get("permission") or "None") in ("ReadOnly", "WriteOnly", "ReadWrite")]
              if not principal or not active:
                  return

              response.require_resources(
                  rsp,
                  name="cloudferro-grantee-storages",
                  api_version="pkg.internal/v1beta1",
                  kind="Storage",
                  namespace=namespace,
                  match_labels={"storages.pkg.internal/discoverable": "true"},
              )
              peer_storages = request.get_required_resources(req, "cloudferro-grantee-storages") or []
              if not peer_storages:
                  return

              projects = {}
              for grantee in sorted({(grant.get("grantee") or "").strip() for grant in active}):
                  matches = [peer for peer in peer_storages
                             if ((peer.get("spec") or {}).get("principal") or "").strip() == grantee]
                  if not matches:
                      return
                  if len(matches) != 1:
                      response.fatal(rsp, f"CloudFerro grantee principal {grantee} must identify one discoverable Storage.")
                      return
                  peer = matches[0]
                  peer_metadata = peer.get("metadata") or {}
                  peer_spec = peer.get("spec") or {}
                  peer_provider = (((peer_spec.get("crossplane") or {}).get("compositionSelector") or {}).get("matchLabels") or {}).get("provider")
                  if peer_provider != "cloudferro":
                      response.fatal(rsp, f"CloudFerro grantee principal {grantee} does not use the cloudferro backend.")
                      return
                  project_id = ((peer_metadata.get("annotations") or {}).get(
                      "storages.pkg.internal/cloudferro-project-id") or "").strip()
                  if not re.fullmatch(r"[0-9a-f]{32}", project_id):
                      response.fatal(rsp, f"CloudFerro grantee principal {grantee} has an invalid project ID.")
                      return
                  projects[grantee] = project_id

              by_bucket = {}
              for grant in active:
                  bucket = (grant.get("bucketName") or "").strip()
                  grantee = (grant.get("grantee") or "").strip()
                  permission = (grant.get("permission") or "None").strip()
                  by_bucket.setdefault(bucket, []).extend(statements(bucket, projects[grantee], permission))

              for bucket, bucket_statements in sorted(by_bucket.items()):
                  key = f"bucketpolicy-{bucket}"
                  policy = {"Version": "2012-10-17", "Statement": bucket_statements}
                  rsp.desired.resources[key].resource.update({
                      "apiVersion": "s3.aws.m.upbound.io/v1beta1",
                      "kind": "BucketPolicy",
                      "metadata": {"name": key, "namespace": namespace,
                                   "annotations": {"crossplane.io/composition-resource-name": key}},
                      "spec": {
                          "forProvider": {
                              "bucket": bucket,
                              "region": "us-east-1",
                              "policy": json.dumps(policy, separators=(",", ":"), sort_keys=True),
                          },
                          "providerConfigRef": {"name": f"cloudferro-s3-{principal}", "kind": "ProviderConfig"},
                      },
                  })
                  usage_key = f"usage-{key}"
                  rsp.desired.resources[usage_key].ready = fnv1.READY_TRUE
                  rsp.desired.resources[usage_key].resource.update({
                      "apiVersion": "protection.crossplane.io/v1beta1",
                      "kind": "Usage",
                      "metadata": {"name": usage_key, "namespace": namespace,
                                   "annotations": {"crossplane.io/composition-resource-name": usage_key}},
                      "spec": {
                          "replayDeletion": True,
                          "of": {
                              "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                              "kind": "Object",
                              "resourceRef": {"name": f"cloudferro-s3-{principal}"},
                          },
                          "by": {
                              "apiVersion": "s3.aws.m.upbound.io/v1beta1",
                              "kind": "BucketPolicy",
                              "resourceRef": {"name": key},
                          },
                      },
                  })
                  credential_usage_key = f"usage-credential-{key}"
                  rsp.desired.resources[credential_usage_key].ready = fnv1.READY_TRUE
                  rsp.desired.resources[credential_usage_key].resource.update({
                      "apiVersion": "protection.crossplane.io/v1beta1",
                      "kind": "Usage",
                      "metadata": {"name": credential_usage_key, "namespace": namespace,
                                   "annotations": {"crossplane.io/composition-resource-name": credential_usage_key}},
                      "spec": {
                          "replayDeletion": True,
                          "of": {
                              "apiVersion": "identity.openstack.m.crossplane.io/v1alpha1",
                              "kind": "EC2CredentialV3",
                              "resourceRef": {"name": generation},
                          },
                          "by": {
                              "apiVersion": "s3.aws.m.upbound.io/v1beta1",
                              "kind": "BucketPolicy",
                              "resourceRef": {"name": key},
                          },
                      },
                  })
    - step: manage-lifecycle-rules
      functionRef:
        name: crossplane-contrib-function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          from datetime import datetime
          import shlex

          from crossplane.function.proto.v1 import run_function_pb2 as fnv1
          from google.protobuf import json_format

          ENVIRONMENT_KEY = "apiextensions.crossplane.io/environment"

          def to_dict(x):
              return {} if x is None else (x if isinstance(x, dict) else json_format.MessageToDict(x, preserving_proto_field_name=True))

          def _normalize_target(target: str) -> str | None:
              value = (target or "").strip()
              if not value:
                  return None
              if value == "*":
                  return ""
              if "*" in value[:-1]:
                  return None
              if value.endswith("*"):
                  value = value[:-1]
              return value.lstrip("/")

          def _normalize_after(value: str) -> str:
              rel = (value or "").strip()
              if rel.startswith("+"):
                  rel = rel[1:]
              if not rel:
                  return rel
              unit = rel[-1]
              if unit in ("S", "s", "M", "m", "H", "h", "D", "d", "W", "w"):
                  return rel[:-1] + unit.lower()
              return rel

          def _parse_at_epoch(value: str) -> int | None:
              timestamp = (value or "").strip()
              if not timestamp:
                  return None
              if timestamp.endswith("Z"):
                  timestamp = timestamp[:-1] + "+00:00"
              try:
                  return int(datetime.fromisoformat(timestamp).timestamp())
              except Exception:
                  return None

          def _build_script(bucket: str, rule: dict) -> str:
              mode = (rule.get("mode") or "").strip()
              target = _normalize_target(rule.get("target") or "")
              remote_path = bucket if not target else f"{bucket}/{target}"
              remote = shlex.quote(f"storage:{remote_path}")
              target_display = target or "*"

              min_age = (rule.get("minAge") or "").strip()
              at = (rule.get("at") or "").strip()
              if min_age:
                  min_age = _normalize_after(min_age)
                  action = "lsf" if mode == "Notify" else "delete"
                  recursive = " --recursive" if mode == "Notify" else ""
                  return "\n".join([
                      "#!/bin/sh",
                      "set -eu",
                      f"exec rclone {action} {remote}{recursive} --min-age {shlex.quote(min_age)} --fast-list --s3-no-check-bucket",
                  ]) + "\n"

              at_epoch = _parse_at_epoch(at)
              if at_epoch is None:
                  return "\n".join([
                      "#!/bin/sh",
                      "set -eu",
                      f"echo {shlex.quote(f'Invalid lifecycle timestamp for {bucket}/{target_display}; skipping.')}",
                  ]) + "\n"
              return "\n".join([
                  "#!/bin/sh",
                  "set -eu",
                  'now="$(date -u +%s)"',
                  f'cutoff="{at_epoch}"',
                  'if [ "$now" -lt "$cutoff" ]; then',
                  "  exit 0",
                  "fi",
                  f"exec rclone {'lsf' if mode == 'Notify' else 'delete'} {remote}{' --recursive' if mode == 'Notify' else ''} --fast-list --s3-no-check-bucket",
              ]) + "\n"

          def compose(req: fnv1.RunFunctionRequest, rsp: fnv1.RunFunctionResponse):
              xr = to_dict(req.observed.composite.resource)
              meta = xr.get("metadata", {}) or {}
              spec = xr.get("spec", {}) or {}
              ctx = to_dict(req.context)
              env = (ctx.get(ENVIRONMENT_KEY) or {})
              storage_env = (env.get("storage") or {})
              ns = meta.get("namespace") or "default"
              principal = (spec.get("principal") or meta.get("name") or "<principal-missing>").strip()

              rules = []
              for bucket_cfg in (spec.get("buckets") or []):
                  bucket = (bucket_cfg.get("bucketName") or "").strip()
                  if not bucket:
                      continue
                  for index, rule in enumerate(bucket_cfg.get("lifecycleRules") or [], start=1):
                      target = _normalize_target(rule.get("target") or "")
                      if target is None:
                          continue
                      rules.append({
                          "bucket": bucket,
                          "index": index,
                          "target": target,
                          "mode": (rule.get("mode") or "").strip(),
                          "minAge": (rule.get("minAge") or "").strip(),
                          "at": (rule.get("at") or "").strip(),
                      })

              if not rules:
                  return

              storage_type = (storage_env.get("type") or "").strip() or "s3"
              storage_provider = (storage_env.get("provider") or "").strip() or "Other"
              storage_region = (storage_env.get("s3Region") or "").strip()
              endpoint = (storage_env.get("endpoint") or "").strip()
              if not endpoint or not storage_region:
                  return
              lifecycle = (storage_env.get("lifecycle") or {})
              schedule = (lifecycle.get("schedule") or "").strip() or "17 2 * * *"
              force_path_style = storage_env.get("force_path_style")
              if force_path_style not in (None, ""):
                  force_path_style = str(force_path_style)
              image = "rclone/rclone:1.75.1"
              for package in (env.get("packages") or []):
                  if (package.get("name") or "").strip() != "rclone":
                      continue
                  for file_entry in (package.get("files") or []):
                      image_url = (((file_entry.get("image") or {}).get("url")) or "").strip()
                      if image_url:
                          image = image_url
                          break
                  break

              scripts = {}
              containers = []
              for idx, rule in enumerate(rules, start=1):
                  key = f"rule-{idx:02d}.sh"
                  display_target = rule["target"] or "*"
                  scripts[key] = _build_script(rule["bucket"], rule)
                  container_env = [
                      {"name": "HOME", "value": "/tmp"},
                      {"name": "RCLONE_CONFIG", "value": "/dev/null"},
                      {"name": "RCLONE_CONFIG_STORAGE_TYPE", "value": storage_type},
                      {"name": "RCLONE_CONFIG_STORAGE_PROVIDER", "value": storage_provider},
                  ]
                  if endpoint:
                      container_env.append({"name": "RCLONE_CONFIG_STORAGE_ENDPOINT", "value": endpoint})
                  if force_path_style not in (None, ""):
                      container_env.append({"name": "RCLONE_CONFIG_STORAGE_FORCE_PATH_STYLE", "value": force_path_style})
                  if storage_region:
                      container_env.append({"name": "RCLONE_CONFIG_STORAGE_REGION", "value": storage_region})
                  container_env.extend([
                      {"name": "RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID", "valueFrom": {"secretKeyRef": {"name": principal, "key": "AWS_ACCESS_KEY_ID"}}},
                      {"name": "RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY", "valueFrom": {"secretKeyRef": {"name": principal, "key": "AWS_SECRET_ACCESS_KEY"}}},
                      {"name": "STORAGE_LIFECYCLE_BUCKET", "value": rule["bucket"]},
                      {"name": "STORAGE_LIFECYCLE_TARGET", "value": display_target},
                  ])
                  containers.append({
                      "name": f"lifecycle-{idx:02d}",
                      "image": image,
                      "imagePullPolicy": "IfNotPresent",
                      "command": ["/bin/sh", "/opt/lifecycle/run.sh"],
                      "securityContext": {
                          "allowPrivilegeEscalation": False,
                          "capabilities": {"drop": ["ALL"]},
                          "readOnlyRootFilesystem": True,
                      },
                      "env": container_env,
                      "volumeMounts": [
                          {"name": "lifecycle-scripts", "mountPath": "/opt/lifecycle/run.sh", "subPath": key, "readOnly": True},
                          {"name": "scratch", "mountPath": "/tmp"},
                      ],
                      "resources": {
                          "requests": {"cpu": "50m", "memory": "64Mi"},
                          "limits": {"cpu": "250m", "memory": "256Mi"},
                      },
                  })

              config_key = f"lifecycle-config-{principal}"
              config_name = f"{principal}-lifecycle"
              rsp.desired.resources[config_key].resource.update({
                  "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                  "kind": "Object",
                  "metadata": {
                      "name": config_key,
                      "namespace": ns,
                      "annotations": {"crossplane.io/composition-resource-name": config_key}
                  },
                  "spec": {
                      "forProvider": {
                          "manifest": {
                              "apiVersion": "v1",
                              "kind": "ConfigMap",
                              "metadata": {
                                  "name": config_name,
                                  "namespace": ns,
                              },
                              "data": scripts,
                          }
                      },
                      "providerConfigRef": {"name": "provider-kubernetes", "kind": "ProviderConfig"}
                  }
              })

              cron_key = f"lifecycle-cron-{principal}"
              cron_name = f"{principal}-lifecycle"
              rsp.desired.resources[cron_key].resource.update({
                  "apiVersion": "kubernetes.m.crossplane.io/v1alpha1",
                  "kind": "Object",
                  "metadata": {
                      "name": cron_key,
                      "namespace": ns,
                      "annotations": {"crossplane.io/composition-resource-name": cron_key}
                  },
                  "spec": {
                      "forProvider": {
                          "manifest": {
                              "apiVersion": "batch/v1",
                              "kind": "CronJob",
                              "metadata": {
                                  "name": cron_name,
                                  "namespace": ns,
                                  "labels": {
                                      "app.kubernetes.io/name": "storage-lifecycle",
                                      "storages.pkg.internal/principal": principal,
                                  }
                              },
                              "spec": {
                                  "schedule": schedule,
                                  "concurrencyPolicy": "Forbid",
                                  "successfulJobsHistoryLimit": 1,
                                  "failedJobsHistoryLimit": 1,
                                  "jobTemplate": {
                                      "spec": {
                                          "template": {
                                              "spec": {
                                                  "automountServiceAccountToken": False,
                                                  "restartPolicy": "OnFailure",
                                                  "securityContext": {
                                                      "runAsNonRoot": True,
                                                      "runAsUser": 1000,
                                                      "runAsGroup": 1000,
                                                      "fsGroup": 1000,
                                                      "seccompProfile": {"type": "RuntimeDefault"},
                                                  },
                                                  "containers": containers,
                                                  "volumes": [
                                                      {
                                                          "name": "lifecycle-scripts",
                                                          "configMap": {
                                                              "name": config_name,
                                                              "defaultMode": 493,
                                                          }
                                                      },
                                                      {"name": "scratch", "emptyDir": {}},
                                                  ],
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      },
                      "providerConfigRef": {"name": "provider-kubernetes", "kind": "ProviderConfig"}
                  }
              })
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: crossplane-contrib-function-auto-ready
