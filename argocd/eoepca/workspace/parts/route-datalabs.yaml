# Route Datalab sessions (kind Ingress) to APISIX gateway Service in ingress-apisix
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspace-datalabs
  namespace: workspace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: eoepca-public
      namespace: gateway
      sectionName: workspaces-https
  hostnames:
    - "*.lab.develop-v2.eoepca.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: apisix-gateway
          namespace: ingress-apisix
          port: 80
---
# Permit above HTTPRoute to use the APISIX gateway Service in ingress-apisix.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: workspace-apisix
  namespace: ingress-apisix
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: workspace
  to:
    - group: ""
      kind: Service
      name: apisix-gateway
