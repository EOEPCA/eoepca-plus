apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: workspace-default-storage-minio
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - pkg.internal
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - storages
  matchConditions:
    - name: workspace-namespace
      expression: object.metadata.namespace == "workspace"
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          has(object.spec.crossplane) &&
          (has(object.spec.crossplane.compositionRef) ||
           has(object.spec.crossplane.compositionSelector))
          ? Object{}
          : Object{
            spec: Object.spec{
              crossplane: Object.spec.crossplane{
                compositionSelector: Object.spec.crossplane.compositionSelector{
                  matchLabels: {"provider": "minio"}
                }
              }
            }
          }
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          (has(object.spec.crossplane.compositionRef)
            ? object.spec.crossplane.compositionRef.name == "storage-minio"
            : has(object.spec.crossplane.compositionSelector.matchLabels) &&
              "provider" in object.spec.crossplane.compositionSelector.matchLabels &&
              object.spec.crossplane.compositionSelector.matchLabels["provider"] == "minio") &&
          !((has(object.metadata.annotations) &&
            "storages.pkg.internal/environment" in object.metadata.annotations) ||
           (has(object.metadata.labels) &&
            "storages.pkg.internal/environment" in object.metadata.labels))
          ? Object{
              metadata: Object.metadata{
                annotations: {
                  "storages.pkg.internal/environment": "storage-minio"
                }
              }
            }
          : Object{}
