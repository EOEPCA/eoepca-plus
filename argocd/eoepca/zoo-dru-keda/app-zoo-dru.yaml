apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zoo-project-dru-keda
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: zoo-project-dru-keda
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    repoURL: https://github.com/EOEPCA/eoepca-plus
    targetRevision: rke2-argocd-sync-wave
    path: argocd/eoepca/zoo-dru-keda/parts
  destination:
    name: in-cluster
    namespace: zookeda
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
        - /operation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
