apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    eoepca/app-name: zoo-project-dru-keda
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Kyverno for policy management in KEDA deployment
  project: eoepca
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: "3.5.2"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/argocd/eoepca/zoo-dru-keda/parts/values-kyverno.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop-frozen
      ref: values
  destination:
    name: in-cluster
    namespace: kyverno-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - ServerSideApply=true
