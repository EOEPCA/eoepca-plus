apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    eoepca/app-name: zoo-project-dru-keda
spec:
  # Kyverno for policy management in KEDA deployment
  project: eoepca
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: "3.5.2"
      helm:
        releaseName: kyverno
        values:
          crds:
            install: true
          replicaCount: 2
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    name: in-cluster
    namespace: kyverno-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zoo-project-dru-keda-core
  namespace: argocd
  labels:
    eoepca/app-name: zoo-project-dru-keda
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  sources:
    - repoURL: https://zoo-project.github.io/charts/
      chart: zoo-project-dru
      targetRevision: 0.9.2
      helm:
        releaseName: zoo-project-dru
        valueFiles:
          - $values/argocd/eoepca/zoo-dru-keda/parts/values-zoo.yaml
          # - $values/argocd/eoepca/zoo-dru-keda/parts/values-stageout.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: deploy-develop
      ref: values

  destination:
    name: in-cluster
    namespace: zookeda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
