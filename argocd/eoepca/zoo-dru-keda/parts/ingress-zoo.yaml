---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: zoo-route
  namespace: zookeda
spec:
  http:
    # Backdoor for open access
    - name: zookeda-open
      match:
        hosts:
          - zookeda-open.rke2.deploybox.co.uk
        paths:
          - /*
      backends:
        - serviceName: zoo-project-dru-keda-service
          servicePort: 80
      plugins:
        # Allow CORS access
        - name: cors
          enable: true
    # Open access to zoo OpenAPI docs
    - name: zookeda-docs
      match:
        hosts:
          - zookeda.rke2.deploybox.co.uk
        paths:
          - /ogc-api
          - /ogc-api/
          - /ogc-api/api*
          - /swagger-ui*
          - /conformance*
      backends:
        - serviceName: zoo-project-dru-keda-service
          servicePort: 80
      plugins:
        # Allow CORS access
        - name: cors
          enable: true
    # Authorized access to zoo API
    - name: zookeda-protected
      match:
        hosts:
          - zookeda.rke2.deploybox.co.uk
        paths:
          - /*
      backends:
        - serviceName: zoo-project-dru-keda-service
          servicePort: 80
      plugins:
        # Authn - expect JWT in `Authorization: Bearer` header
        - name: openid-connect
          enable: true
          config:
            client_id: "zoo"
            client_secret: "Fsw9DtGQ52lje15lQtPC8CDxhpwqE8Di"
            discovery: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/openid-configuration"
            realm: eoepca
            use_jwks: true
            bearer_only: false # as we want to redirect to login screen (default: false)
            set_access_token_header: true  # (default: true)
            access_token_in_authorization_header: true  # (default: false)
        # Authz
        - name: authz-keycloak
          enable: true
          config:
            client_id: "zoo"
            client_secret: "Fsw9DtGQ52lje15lQtPC8CDxhpwqE8Di"
            discovery: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/uma2-configuration"
            lazy_load_paths: true
            ssl_verify: false
        # Allow CORS access
        - name: cors
          enable: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zookeda-tls
spec:
  dnsNames:
    - zookeda.rke2.deploybox.co.uk
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns-prod
  secretName: zookeda-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: zookeda
spec:
  hosts:
    - zookeda.rke2.deploybox.co.uk
  secret:
    name: zookeda-tls
    namespace: zookeda
