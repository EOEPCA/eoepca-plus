# Copies the client secrets that Crossplane writes into iam-management (iam.yaml,
# writeConnectionSecretToRef) into the zooslurm namespace. Same pattern as
# zoo-dru-std/parts/iam-secret-propagation.yaml.
#   zoo-slurm-iam-client-credentials  for the APISIX plugins (ingress-zoo.yaml)
#   zoo-slurm-runner-env              environment of ZOO-FPM (values-zoo.yaml, workflow.extraEnvFrom)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zoo-slurm-iam-secret-reader
  namespace: iam-management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zoo-slurm-iam-secret-reader
  namespace: iam-management
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zoo-slurm-oidc", "zoo-slurm-runner-oidc", "zoo-slurm-poller-oidc"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zoo-slurm-iam-secret-reader
  namespace: iam-management
subjects:
  - kind: ServiceAccount
    name: zoo-slurm-iam-secret-reader
    namespace: iam-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zoo-slurm-iam-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: zoo-slurm-iam
spec:
  provider:
    kubernetes:
      remoteNamespace: iam-management
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: iam-management
      auth:
        serviceAccount:
          name: zoo-slurm-iam-secret-reader
          namespace: iam-management
  conditions:
    - namespaces:
        - zooslurm
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zoo-slurm-iam-client-credentials
  namespace: zooslurm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: zoo-slurm-iam
  target:
    name: zoo-slurm-iam-client-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: zoo-slurm-oidc
        property: clientID
    - secretKey: client_secret
      remoteRef:
        key: zoo-slurm-oidc
        property: attribute.client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zoo-slurm-runner-env
  namespace: zooslurm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: zoo-slurm-iam
  target:
    name: zoo-slurm-runner-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLURM_TOKEN_CLIENT_SECRET
      remoteRef:
        key: zoo-slurm-runner-oidc
        property: attribute.client_secret
    - secretKey: SLURM_POLL_CLIENT_SECRET
      remoteRef:
        key: zoo-slurm-poller-oidc
        property: attribute.client_secret
