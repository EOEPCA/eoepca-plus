---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationPermission
metadata:
  name: zoo-slurm-slurm-test-1-access
  namespace: iam-management
spec:
  managementPolicies:
    - Create
    - Observe
    - Delete
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: slurm-test-1-access
    type: resource
    decisionStrategy: UNANIMOUS
    resourceServerIdRef:
      name: zoo-slurm
      policy:
        resolution: Required
    resources:
