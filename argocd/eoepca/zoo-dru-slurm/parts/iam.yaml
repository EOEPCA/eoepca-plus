# Keycloak objects for ZOO with the Slurm runner.
#
# Three clients, so that no token a user gets for ZOO is accepted by Slurm:
#   zoo-slurm         Login client of the API gateway (APISIX openid-connect and
#                     authz-keycloak). Its access tokens carry the audience
#                     zoo-slurm-runner, but no claim `sun`, so Slurm refuses them.
#   zoo-slurm-runner  The runner exchanges the user's token for a token of this client
#                     (Standard Token Exchange). Only this client and slurm-cli map the
#                     admin-only user attribute `slurm_user` to the claim `sun`, which
#                     Slurm takes as the POSIX user name (see slurm/parts/iam.yaml).
#                     Keycloak only exchanges tokens whose audience contains this client.
#   zoo-slurm-poller  Service account only. Its tokens carry the fixed claim
#                     sun=zoo-poll, an unprivileged account used only to read job
#                     states while a job runs longer than the user's token.
#
# Per-user paths: as zoo-dru-std, one UMA resource per user path, enforced by the
# authz-keycloak plugin in ingress-zoo.yaml. Keycloak matches the most specific resource,
# so /slurm-test-1/* is reachable for slurm-test-1 only. ZOO itself does not check that
# the user in the path is the user in the token, so the protected route is the only route.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: zoo-slurm
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: zoo-slurm-oidc
  forProvider:
    realmId: eoepca
    name: zoo-slurm
    clientId: zoo-slurm
    accessType: CONFIDENTIAL
    enabled: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    # Password grant for scripted tests with the Slurm test users.
    directAccessGrantsEnabled: true
    fullScopeAllowed: true
    serviceAccountsEnabled: true
    useRefreshTokens: true
    rootUrl: https://zooslurm.develop-v2.eoepca.org
    validRedirectUris:
      - https://zooslurm.develop-v2.eoepca.org/*
    webOrigins:
      - https://zooslurm.develop-v2.eoepca.org
    authorization:
      - policyEnforcementMode: ENFORCING
        decisionStrategy: UNANIMOUS
        keepDefaults: false
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: zoo-slurm-runner-audience
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: zoo-slurm
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    name: zoo-slurm-runner-audience
    config:
      "included.client.audience": "zoo-slurm-runner"
      "access.token.claim": "true"
      "id.token.claim": "false"
      "introspection.token.claim": "true"
      "userinfo.token.claim": "false"
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: zoo-slurm-runner
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: zoo-slurm-runner-oidc
  forProvider:
    realmId: eoepca
    name: zoo-slurm-runner
    clientId: zoo-slurm-runner
    accessType: CONFIDENTIAL
    enabled: true
    standardTokenExchangeEnabled: true
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: false
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: zoo-slurm-runner-slurm-user-name
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: zoo-slurm-runner
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-usermodel-attribute-mapper
    name: slurm-user-name
    config:
      "user.attribute": "slurm_user"
      "claim.name": "sun"
      "jsonType.label": "String"
      "access.token.claim": "true"
      "id.token.claim": "false"
      "userinfo.token.claim": "false"
      "introspection.token.claim": "true"
      "multivalued": "false"
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: zoo-slurm-poller
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: zoo-slurm-poller-oidc
  forProvider:
    realmId: eoepca
    name: zoo-slurm-poller
    clientId: zoo-slurm-poller
    accessType: CONFIDENTIAL
    enabled: true
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    fullScopeAllowed: false
---
apiVersion: client.keycloak.m.crossplane.io/v1alpha1
kind: ProtocolMapper
metadata:
  name: zoo-slurm-poller-slurm-user-name
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    clientIdRef:
      name: zoo-slurm-poller
      policy:
        resolution: Required
    realmId: eoepca
    protocol: openid-connect
    protocolMapper: oidc-hardcoded-claim-mapper
    name: slurm-poll-user
    config:
      "claim.name": "sun"
      "claim.value": "zoo-poll"
      "jsonType.label": "String"
      "access.token.claim": "true"
      "id.token.claim": "false"
      "userinfo.token.claim": "false"
      "introspection.token.claim": "true"
---
# UMA resources, one per user path, plus /* for the process list and the job list.
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationResource
metadata:
  name: zoo-slurm-slurm-test-1-home
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: slurm-test-1-home
    uris:
      - /slurm-test-1/*
    resourceServerIdRef:
      name: zoo-slurm
      policy:
        resolution: Required
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationResource
metadata:
  name: zoo-slurm-slurm-test-2-home
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: slurm-test-2-home
