    resourceServerIdRef:
      name: zoo-slurm
      policy:
        resolution: Required
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientUserPolicy
metadata:
  name: zoo-slurm-slurm-test-1-policy
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: slurm-test-1-policy
    logic: POSITIVE
    decisionStrategy: UNANIMOUS
    resourceServerIdRef:
      name: zoo-slurm
      policy:
        resolution: Required
    usersRefs:
      # Keycloak users declared in argocd/eoepca/slurm/parts/iam.yaml
      - name: slurm-test-1
        policy:
          resolution: Required
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
