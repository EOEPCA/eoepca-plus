metadata:
  name: zoo-slurm-default-resource
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: default-resource
    uris:
