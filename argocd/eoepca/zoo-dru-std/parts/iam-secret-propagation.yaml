# Mirrors argocd/eoepca/resource-health/parts/iam-secret-propagation.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zoo-iam-secret-reader
  namespace: iam-management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zoo-iam-secret-reader
  namespace: iam-management
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zoo-iam-secret-reader
  namespace: iam-management
subjects:
  - kind: ServiceAccount
    name: zoo-iam-secret-reader
    namespace: iam-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zoo-iam-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: zoo-iam
spec:
  provider:
    kubernetes:
      remoteNamespace: iam-management
      server:
        url: kubernetes.default
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: iam-management
      auth:
        serviceAccount:
          name: zoo-iam-secret-reader
          namespace: iam-management
  conditions:
    - namespaces:
        - zoostd
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zoo-iam-client-credentials
  namespace: zoostd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: zoo-iam
  target:
    name: zoo-iam-client-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: zoo-oidc
        property: clientID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client_secret
      remoteRef:
        key: zoo-oidc
        property: attribute.client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: session.secret
      remoteRef:
        key: zoo-session-secret
        property: session.secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
