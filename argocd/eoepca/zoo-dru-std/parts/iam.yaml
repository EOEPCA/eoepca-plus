apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: zoo
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: zoo-oidc
  forProvider:
    realmId: eoepca
    name: zoo
    accessType: CONFIDENTIAL
    clientId: zoo
    enabled: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    fullScopeAllowed: true
    serviceAccountsEnabled: true
    useRefreshTokens: true
    rootUrl: https://zoostd.develop-v2.eoepca.org
    validRedirectUris:
      - https://zoostd.develop-v2.eoepca.org/*
      - https://zoostd-open.develop-v2.eoepca.org/*
      - https://webuistd.develop-v2.eoepca.org/*
    webOrigins:
      - https://zoostd.develop-v2.eoepca.org
      - https://zoostd-open.develop-v2.eoepca.org
      - https://webuistd.develop-v2.eoepca.org
    authorization:
      - policyEnforcementMode: ENFORCING
        decisionStrategy: UNANIMOUS
        keepDefaults: true
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: Client
metadata:
  name: zoo-webapp
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  writeConnectionSecretToRef:
    name: zoo-webapp-oidc
  forProvider:
    realmId: eoepca
    name: zoo-webapp
    accessType: CONFIDENTIAL
    clientId: zoo-webapp
    enabled: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    fullScopeAllowed: true
    serviceAccountsEnabled: false
    useRefreshTokens: true
    rootUrl: https://webuistd.develop-v2.eoepca.org
    validRedirectUris:
      - https://webuistd.develop-v2.eoepca.org/*
    webOrigins:
      - https://webuistd.develop-v2.eoepca.org
---
# crossplane resources
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientAuthorizationResource
metadata:
  name: zoo-alice-home
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: alice-home
    uris:
      - /alice/*
    resourceServerIdRef:
      name: zoo
      policy:
        resolution: Required
---
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
