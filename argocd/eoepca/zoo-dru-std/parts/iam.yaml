---
# crossplane policies
apiVersion: openidclient.keycloak.m.crossplane.io/v1alpha1
kind: ClientUserPolicy
metadata:
  name: zoo-alice-policy
  namespace: iam-management
spec:
  providerConfigRef:
    name: keycloak-provider-config
    kind: ProviderConfig
  forProvider:
    realmId: eoepca
    name: alice-policy
    logic: POSITIVE
    decisionStrategy: UNANIMOUS
    resourceServerIdRef:
      name: zoo
      policy:
        resolution: Required
    usersRefs:
      - name: alice
        policy:
          resolution: Required
---
