cookiecutter:
  templateUrl: https://github.com/gfenoy/eoepca-proc-service-template.git
  templateBranch: feature/zoo-template-common
zoo:
  openapi:
    enabled: true
zoofpm:
  image:
    tag: eoepca-f0080845011eb3fad53f49ee577a2e61dd8331f0
zookernel:
  env:
    ZOO_OUTPUT_FORMAT: "stac-collection"
  image:
    tag: eoepca-f0080845011eb3fad53f49ee577a2e61dd8331f0
customConfig:
  main:
    eoepca: |-
      domain=rke2.deploybox.co.uk
      workspace_url=https://workspace-api.rke2.deploybox.co.uk
      workspace_prefix=ws
      workspace_catalog_register=false
workflow:
  defaultMaxRam: "1024"
  defaultMaxCores: "2"
  extraEnvFrom:
    - secretRef:
        name: zoo-workflow-env
  inputs:
    STAGEOUT_AWS_SERVICEURL: https://minio.rke2.deploybox.co.uk
    STAGEOUT_AWS_ACCESS_KEY_ID: eoepca
    STAGEOUT_AWS_SECRET_ACCESS_KEY: changeme
    STAGEOUT_AWS_REGION: RegionOne
    STAGEOUT_OUTPUT: eoepca
  nodeSelector: {}
  storageClass: managed-nfs-storage-retain
ingress:
  enabled: false
  hosturl: https://zoostd.rke2.deploybox.co.uk
  annotations:
    kubernetes.io/ingress.class: apisix
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    argocd.argoproj.io/ignore-healthcheck: "true"
  hosts:
  - host: zoostd.rke2.deploybox.co.uk
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - hosts:
    - zoostd.rke2.deploybox.co.uk
    secretName: zoostd-tls
persistence:
  procServicesStorageClass: managed-nfs-storage-retain
  storageClass: managed-nfs-storage-retain
  tmpStorageClass: managed-nfs-storage
postgresql:
  persistence:
    storageClass: managed-nfs-storage-retain
rabbitmq:
  autoSetup:
    enabled: false
  persistence:
    storageClass: managed-nfs-storage-retain
iam:
  enabled: true
  openIdConnectUrl: https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/openid-configuration
  realm: eoepca
  issuer: https://iam-auth.rke2.deploybox.co.uk/realms/eoepca
  audience: account
documentation:
  enabled: true
dask:
  enabled: true
webui:
  enabled: true
  url: https://webuistd.rke2.deploybox.co.uk
  port: 3000
  image:
    pullPolicy: Always
  oidc:
    issuer: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca"
    authVerifyJwksUri: https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/protocol/openid-connect/certs
    clientId: zoo
    clientSecret: Fsw9DtGQ52lje15lQtPC8CDxhpwqE8Di
