cookiecutter:
  templateUrl: https://github.com/gfenoy/eoepca-proc-service-template-wes.git
  templateBranch: develop
zoofpm:
  image:
    tag: eoepca-83f593861bbadd1a969c5ab33bda3f264cc6a1c9
zookernel:
  image:
    tag: eoepca-83f593861bbadd1a969c5ab33bda3f264cc6a1c9
customConfig:
  main:
    eoepca: |-
      domain=rke2.deploybox.co.uk
      workspace_url=https://workspace-api.rke2.deploybox.co.uk
      workspace_prefix=ws
      workspace_catalog_register=false
workflow:
  defaultMaxRam: 1024
  defaultMaxCores: 2
  inputs:
    STAGEIN_AWS_SERVICEURL: http://eodata.cloudferro.com
    STAGEIN_AWS_ACCESS_KEY_ID: 4SMIGZNCR8LM1LSUY1HU
    STAGEIN_AWS_SECRET_ACCESS_KEY: MBiw2FOddg3Fs2Rm9NoDy10qufvJ4hzjmlQ1qwzV
    STAGEIN_AWS_REGION: WAW3-2
    STAGEOUT_AWS_SERVICEURL: https://minio.rke2.deploybox.co.uk
    STAGEOUT_AWS_ACCESS_KEY_ID: eoepca
    STAGEOUT_AWS_SECRET_ACCESS_KEY: changeme
    STAGEOUT_AWS_REGION: RegionOne
    STAGEOUT_OUTPUT: eoepca
    WES_URL: "http://145.239.195.35:8101/ga4gh/wes/v1/"
    WES_USER: "test"
    WES_PASSWORD: "$$2y$$12$$ci.4U63YX83CwkyUrjqxAucnmi2xXOIlEF6T/KdP9824f1Rf1iyNG"
  nodeSelector:
    minikube.k8s.io/primary: "true"
  storageClass: managed-nfs-storage-retain
ingress:
  enabled: false
  hosturl: https://zoowes.rke2.deploybox.co.uk
  annotations:
    kubernetes.io/ingress.class: apisix
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    argocd.argoproj.io/ignore-healthcheck: "true"
  hosts:
  - host: zoowes.rke2.deploybox.co.uk
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - hosts:
    - zoowes.rke2.deploybox.co.uk
    secretName: zoo-tls
persistence:
  procServicesStorageClass: managed-nfs-storage-retain
  storageClass: managed-nfs-storage-retain
  tmpStorageClass: managed-nfs-storage
global:
  security:
    # bitnamilegacy/* images fail the bitnami charts' built-in
    # "recognized image" check (it only allow-lists bitnami/*), which makes
    # helm template hard-fail from rabbitmq's NOTES.txt. The images are
    # identical, just republished under a different registry path.
    allowInsecureImages: true
postgresql:
  # Broadcom pulled versioned bitnami/* image tags from Docker Hub's free
  # tier in 2025; the same images are preserved under bitnamilegacy/*.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.2.0-debian-12-r5
  primary:
    persistence:
      storageClass: managed-nfs-storage-retain
  readReplicas:
    persistence:
      storageClass: managed-nfs-storage-retain
rabbitmq:
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.0.5-debian-12-r0
  persistence:
    storageClass: managed-nfs-storage-retain
iam:
  enabled: false
documentation:
  enabled: true
