cookiecutter:
  templateUrl: https://github.com/gfenoy/eoepca-proc-service-template-wes.git
  templateBranch: develop
zoofpm:
  image:
    tag: eoepca-ad6563d64c564268778263ad41fed9f9d18d07ca
zookernel:
  image:
    tag: eoepca-ad6563d64c564268778263ad41fed9f9d18d07ca
customConfig:
  main:
    eoepca: |-
      domain=develop-v2.eoepca.org
      workspace_url=https://workspace-api.develop-v2.eoepca.org
      workspace_prefix=ws
      workspace_catalog_register=false
workflow:
  defaultMaxRam: "1024"
  defaultMaxCores: "2"
  extraEnvFrom:
    - secretRef:
        name: zoo-workflow-env
  inputs:
    STAGEOUT_AWS_SERVICEURL: https://minio.develop-v2.eoepca.org
    STAGEOUT_AWS_ACCESS_KEY_ID: eoepca
    STAGEOUT_AWS_SECRET_ACCESS_KEY: changeme
    STAGEOUT_AWS_REGION: RegionOne
    STAGEOUT_OUTPUT: eoepca
    WES_URL: "http://145.239.195.35:8101/ga4gh/wes/v1/"
    WES_USER: "test"
    WES_PASSWORD: "$$2y$$12$$ci.4U63YX83CwkyUrjqxAucnmi2xXOIlEF6T/KdP9824f1Rf1iyNG"
  nodeSelector:
    minikube.k8s.io/primary: "true"
  storageClass: managed-nfs-storage-retain
ingress:
  enabled: false
  hosturl: https://zoowes.develop-v2.eoepca.org
  annotations:
    kubernetes.io/ingress.class: apisix
    ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    argocd.argoproj.io/ignore-healthcheck: "true"
  hosts:
  - host: zoowes.develop-v2.eoepca.org
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
  - hosts:
    - zoowes.develop-v2.eoepca.org
    secretName: zoo-tls
persistence:
  procServicesStorageClass: managed-nfs-storage-retain
  storageClass: managed-nfs-storage-retain
  tmpStorageClass: managed-nfs-storage
postgresql:
  # no image override: bitnamilegacy/postgresql fails permission checks under this runAsUser
  primary:
    persistence:
      storageClass: managed-nfs-storage-retain
  readReplicas:
    persistence:
      storageClass: managed-nfs-storage-retain
rabbitmq:
  persistence:
    storageClass: managed-nfs-storage-retain
iam:
  enabled: false
documentation:
  enabled: true
