# Copied from Workspace and adapted

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: apisix
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    repoURL: https://github.com/EOEPCA/eoepca-plus
    targetRevision: rke2-upgrade
    path: argocd/infra/apisix/parts
  destination:
    name: in-cluster
    namespace: ingress-apisix
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - Replace=true