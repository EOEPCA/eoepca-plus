apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-core
  namespace: argocd
  labels:
    eoepca/app-name: apisix
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  sources:
    - repoURL: https://apache.github.io/apisix-helm-chart
      chart: apisix
      targetRevision: 2.16.0
      helm:
        releaseName: apisix
        valueFiles:
          - $values/argocd/infra/apisix/parts/values/apisix-values.yaml
        # APISIX CRDs are owned by apisix-crds; Gateway API CRDs are owned by
        # envoy-gateway. The chart's mixed CRD bundle must not own either set.
        skipCrds: true
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      ref: values

  destination:
    name: in-cluster
    namespace: ingress-apisix
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.versions[].additionalPrinterColumns[].priority | select(. == 0)
    - kind: Secret
      name: apisix-ingress-controller-webhook-cert
      namespace: ingress-apisix
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: apisix-ingress-controller-webhook
      namespace: ingress-apisix
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
#    - group: ""
#      kind: Secret
#      name: apisix-etcd-jwt-token
#      namespace: ingress-apisix
#      jsonPointers:
#        - /data
#    - group: apps
#      kind: StatefulSet
#      name: apisix-etcd
#      namespace: ingress-apisix
#      jqPathExpressions:
#        - '.spec.template.metadata.annotations["checksum/token-secret"]'
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
