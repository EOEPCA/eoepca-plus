apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-crds
  namespace: argocd
  labels:
    eoepca/app-name: apisix
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: eoepca
  source:
    repoURL: https://github.com/apache/apisix-helm-chart.git
    # This is the version of the controller chart on which 2.18.3 of the apisix chart depends
    # via its Chart.yaml.
    targetRevision: apisix-ingress-controller-1.3.0
    path: charts/apisix-ingress-controller/crds
  destination:
    name: in-cluster
    namespace: ingress-apisix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
