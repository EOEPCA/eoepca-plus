# Wildcard certificate for preliminary APISIX ingress *.rke2.deploybox.co.uk
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apx-main-tls
  namespace: ingress-apisix
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  secretName: apx-main-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - server auth
    - client auth
  dnsNames:
    - "rke2.deploybox.co.uk"
  issuerRef:
    # staging issuer: letsencrypt-dns-prod is rate-limited (5 certs/168h) for
    # this exact hostname from repeated cluster teardown/recreate cycles.
    # Must stay DNS-01 (not the http01-nginx letsencrypt-staging issuer):
    # this host is routed by apisix, not the nginx ingress controller, so an
    # nginx-solved HTTP-01 challenge 404s.
    name: letsencrypt-dns-prod
    kind: ClusterIssuer
