# Note: This file is *not* used if APISIX is installed via the iam-bb
# Helm chart. Values are taken from iam-values.yaml instead in this case.
# However, for the EOEPCA 2.0.0-beta2 release, APISIX is still deployed
# separately in the demo environment and so this file remains relevant.
# This may change in the future.

gateway:
  type: NodePort
  http:
    nodePort: 32080
  tls:
    nodePort: 32443

apisix:
  enableIPv6: false
  enableServerTokens: false

  ssl:
    enabled: true
    # -- Specifies the name of Secret contains trusted CA certificates in the PEM format used to verify the certificate when APISIX needs to do SSL/TLS handshaking with external services (e.g. etcd)
    existingCASecret: "apx-all-tls"
    # -- Filename be used in the apisix.ssl.existingCASecret
    certCAFilename: "tls.crt"

  # -- Set APISIX plugin attributes, see [config-default.yaml](https://github.com/apache/apisix/blob/master/conf/config-default.yaml#L376) for more details
  pluginAttrs:
    redirect:
      https_port: 443
    prometheus:
      metrics:
        http_latency:
          extra_labels:
            - http_method: $request_method
            - uri: $uri
        http_status:
          extra_labels:
            - http_method: $request_method
            - uri: $uri
        bandwidth:
          extra_labels:
            - http_method: $request_method
            - uri: $uri

  deployment:
    role: traditional
    role_traditional:
      config_provider: yaml # Standalone Mode

  prometheus:
    enabled: true

etcd:
  # Etcd is not needed in standalone mode.
  enabled: false
#  # Added: Set Cluster-specific storage class
#  persistence:
#    storageClass: managed-nfs-storage-retain
#    size: 8Gi
#  image:
#    repository: bitnamilegacy/etcd

# There is a bug in APISIX 3.15 that causes the health check to contact etcd even though
# it is not used in standalone mode. This causes regular error and warning messages in
# the logs, but does not otherwise impact APISIX's functionality.
# See: https://github.com/apache/apisix/issues/12989
# Uncommenting the following lines causes a DNS-related error message to disappear in
# favour of a warning message regarding connection failure. This does not really solve
# the issue, but lets the logs look a bit less harmful.
#externalEtcd:
#  # Changing host to localhost prevent DNS lookup error - unneeded health check still fails though.
#  host:
#    - http://localhost:2379

# -- Ingress controller configuration
ingress-controller:
  enabled: true
  config:
    execADCTimeout: "60s"
    apisix:
      serviceNamespace: ingress-apisix
#    kubernetes:
#      defaultIngressClass: true
    provider:
      type: apisix-standalone
  gatewayProxy:
    createDefault: true

