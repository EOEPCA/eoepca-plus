apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: sealed-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    # The former GitHub Pages Helm index now returns 404. Pin the chart's
    # official Git tag and path instead.
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: helm-v2.16.0
    path: helm/sealed-secrets
    helm:
      releaseName: sealed-secrets
  destination:
    name: in-cluster
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
