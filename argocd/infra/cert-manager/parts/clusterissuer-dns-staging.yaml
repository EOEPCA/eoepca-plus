apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns-prod
spec:
  acme:
    email: james.hinton@telespazio.com
    privateKeySecretRef:
      name: letsencrypt-dns-prod
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - selector:
          dnsZones:
            - "deploybox.co.uk"
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: dns-api-token
              key: api-token
