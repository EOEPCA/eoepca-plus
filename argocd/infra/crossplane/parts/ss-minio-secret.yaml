---
# Credentials for provider-minio's ProviderConfig, in the AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY format it expects. Values must match the minio-auth
# rootUser/rootPassword sealed secret in argocd/infra/minio/parts.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: minio-secret
  namespace: workspace
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: minio-secret
      namespace: workspace
