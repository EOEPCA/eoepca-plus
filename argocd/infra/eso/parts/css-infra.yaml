apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store-infra
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-reader
  namespace: infra
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-reader-binding
  namespace: infra
subjects:
  - kind: ServiceAccount
    name: eso-store-infra
    namespace: infra
roleRef:
  kind: Role
  name: eso-store-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infra
spec:
  provider:
    kubernetes:
      remoteNamespace: infra
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: infra
      auth:
        serviceAccount:
          name: eso-store-infra
          namespace: infra
