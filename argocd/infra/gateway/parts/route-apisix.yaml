#-------------------------------------------------------------------------------
# APISIX - No hostname rules, so acts as Default Route
#-------------------------------------------------------------------------------

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apisix
  namespace: ingress-apisix
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eoepca-public
      namespace: gateway
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: apisix-gateway
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: apisix
  namespace: ingress-apisix
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eoepca-public
      namespace: gateway
  # Unlike HTTPRoute, this cluster's TLSRoute CRD requires spec.hostnames
  # (SNI match) to be non-empty; there is no "match everything" form.
  hostnames:
    - "rke2.deploybox.co.uk"
    - "*.rke2.deploybox.co.uk"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: apisix-gateway
          port: 443
          weight: 1
