#-------------------------------------------------------------------------------
# APISIX - No hostname rules, so acts as Default Route
#-------------------------------------------------------------------------------

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apisix
  namespace: ingress-apisix
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eoepca-public
      namespace: gateway
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: apisix-gateway
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: TLSRoute
metadata:
  name: apisix
  namespace: ingress-apisix
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eoepca-public
      namespace: gateway
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: apisix-gateway
          port: 443
          weight: 1
