---
id: stac_get_latency_enrichment_warning
description: "Enrich STAC GET latency alerts with Ingress/App/DB bottleneck analysis"
triggers:
- type: alert
  only_on_change:
  - status
  cel: "name == 'STACGetLatencyBudgetBurn_Warning' && status == 'firing'"
name: "STAC GET Latency Enrichment (Warning)"
steps:
- name: get_db_latency
  provider:
    type: prometheus
    config: "{{ providers.prometheus }}"
    with:
      query: "stac_db_mean_latency_ms"
- name: get_gateway_latency
  provider:
    type: prometheus
    config: "{{ providers.prometheus }}"
    with:
      query: "stac_gateway_latency_100ms_burn_rate_6h"
- name: get_app_latency
  provider:
    type: prometheus
    config: "{{ providers.prometheus }}"
    with:
      query: "stac_app_latency_100ms_burn_rate_6h"
- name: generate_suggestion
  provider:
    type: bash
    with:
      shell: true
      command: |
        DB_EXCEEDED='{{ steps.get_db_latency.results.data.result.0.value.1 }}'
        APP_EXCEEDED='{{ steps.get_app_latency.results.data.result.0.value.1 }}'
        GATEWAY_EXCEEDED='{{ steps.get_gateway_latency.results.data.result.0.value.1 }}'

        if [ "$(echo "$DB_EXCEEDED > 70" | bc -l)" -eq 1 ]; then
          echo "Bottleneck likely in DATABASE. Exec time is eating the GET budget."
        elif [ "$(echo "$APP_EXCEEDED > 10" | bc -l)" -eq 1 ]; then
          echo "Bottleneck likely in APPLICATION layer. Consider scaling eoapi-stac."
        elif [ "$(echo "$GATEWAY_EXCEEDED > 10" | bc -l)" -eq 1 ]; then
          echo "Bottleneck likely in APISIX GATEWAY layer."
        else
          echo "Degradation detected, but no single layer is strictly exceeding isolation thresholds. Check network or node health."
        fi
actions:
- name: print-enrichment
  provider:
    type: console
    with:
      message: |-
        keep.uppercase({{ alert.severity }}): {{ alert.name }}

        Diagnostic Analysis:
        - DB Mean Latency: {{ steps.get_db_latency.results.data.result.0.value.1 }}ms
        - Gateway Burn Rate (1h): {{ steps.get_gateway_latency.results.data.result.0.value.1 }}
        - App Burn Rate (1h): {{ steps.get_app_latency.results.data.result.0.value.1 }}

        Action Suggestion:
        {{ steps.generate_suggestion.results.stdout }}

        View Active Dashboard:
        https://monitoring.develop.eoepca.org/d/8dfb46c7-7de5-4033-9c67-02439793bef6/apisix-endpoint-slos?var-route={{ alert.labels.route }}&from=now-6h&to=now

