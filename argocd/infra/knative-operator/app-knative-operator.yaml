apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-operator
  namespace: argocd
  labels:
    eoepca/app-name: knative-operator
    eoepca/is-root-app: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: eoepca
  source:
    chart: knative-operator
    repoURL: https://knative.github.io/operator
    targetRevision: v1.19.5
    helm:
      releaseName: knative-operator
  destination:
    name: in-cluster
    namespace: knative-operator
  # The Kubernetes ClusterRole aggregation controller owns these rule lists.
  # Ignoring only /rules prevents a permanent post-sync drift loop.
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-eventing-operator-aggregated-stable
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-serving-operator-aggregated-stable
      jsonPointers:
        - /rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
