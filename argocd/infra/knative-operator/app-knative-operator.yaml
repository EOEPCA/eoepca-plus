apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-operator
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: na-knative-operator
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    repoURL: 'https://knative.github.io/operator'
    chart: knative-operator
    targetRevision: 1.18.1
    helm:
      releaseName: knative-operator
  destination:
    name: in-cluster
    namespace: knative-operator
  # The Kubernetes ClusterRole aggregation controller owns these rule lists.
  # Ignoring only /rules prevents a permanent post-sync drift loop.
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-eventing-operator-aggregated-stable
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: knative-serving-operator-aggregated-stable
      jsonPointers:
        - /rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
