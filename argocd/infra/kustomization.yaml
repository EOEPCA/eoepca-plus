
resources:
  - kube-dns-alias.yaml
  - app-sealed-secrets.yaml
  # ServiceMonitor and PrometheusRule CRDs are consumed by early infrastructure
  # Applications, before the full Operations monitoring stack can start.
  - monitoring-crds
  - cert-manager
  - harbor
  - minio
  - knative-operator
  - strimzi-operator
  - apisix
  - pgo
  - gateway
  - eso
  - crossplane
  - trivy

patches:
  # Root application waves express dependencies between independently synced
  # Applications. File order in this kustomization does not control sync order.
  - target:
      kind: Application
      name: ^sealed-secrets$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: sealed-secrets
        annotations:
          argocd.argoproj.io/sync-wave: "-50"
  - target:
      kind: Application
      name: ^monitoring-crds$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: monitoring-crds
        annotations:
          argocd.argoproj.io/sync-wave: "-45"
  - target:
      kind: Application
      name: ^cert-manager$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cert-manager
        annotations:
          argocd.argoproj.io/sync-wave: "-40"
  - target:
      kind: Application
      name: ^(crossplane|eso-core|knative-operator|pgo|strimzi-kafka-operator|trivy)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: infrastructure-operators
        annotations:
          argocd.argoproj.io/sync-wave: "-20"
  - target:
      kind: Application
      name: ^(apisix|eso)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: infrastructure-services
        annotations:
          argocd.argoproj.io/sync-wave: "-10"
  - target:
      kind: Application
      name: ^gateway$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: gateway
        annotations:
          argocd.argoproj.io/sync-wave: "-5"
  - target:
      kind: Application
      name: ^(harbor|minio)$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: storage-services
        annotations:
          argocd.argoproj.io/sync-wave: "0"
