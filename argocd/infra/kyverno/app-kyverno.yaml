apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: kyverno
spec:
  # Kyverno for policy management. Originally bundled inside zoo-dru-keda,
  # but it's a shared infra dependency: workspace-dependencies' educates
  # chart (baseline/restricted ClusterPolicies) needs it too, and it was
  # only reaching wave 40 (via zoo-project-dru-keda) while workspace is
  # wave 30, so workspace-dependencies permanently SyncFailed on missing
  # ClusterPolicy CRDs. Moved here so it installs during the infra tier,
  # well before any eoepca BB needs it.
  project: eoepca
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: "3.5.2"
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/argocd/infra/kyverno/values-kyverno.yaml
    - repoURL: https://github.com/EOEPCA/eoepca-plus
      targetRevision: merge-from-deploy-develop
      ref: values
  destination:
    name: in-cluster
    namespace: kyverno-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - ServerSideApply=true
