apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-restricted-audit
  annotations:
    policies.kyverno.io/title: Pod Security Restricted Audit
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Reports workloads which do not meet the Restricted Pod Security Standard.
      This audit phase collects evidence without rejecting workloads.
    kyverno.io/kyverno-version: 1.17.2
    kyverno.io/kubernetes-version: "1.35"
    # Keep evidence on workload-owning controllers without duplicating it for
    # transient ReplicaSets and Jobs. Pods themselves remain covered.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet,CronJob
spec:
  admission: true
  background: true
  # Native PSA already emits v1.35 admission warnings in the rollout
  # namespaces. Kyverno supplies the complementary v1.32 PolicyReports.
  emitWarning: false
  # Audit must stay fail-open. An unavailable policy engine must not block the
  # workloads that this phase is measuring.
  failurePolicy: Ignore
  rules:
    - name: restricted
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchLabels:
                  # Use the same opt-in boundary as native PSA. This keeps the
                  # audit actionable and prevents a cluster-wide report flood.
                  pod-security.kubernetes.io/audit: restricted
      exclude:
        any:
          - resources:
              namespaces:
                # These are the namespace exemptions applied by the RKE2 CIS profile.
                - kube-system
                - compliance-operator-system
                - tigera-operator
      validate:
        allowExistingViolations: true
        failureAction: Audit
        podSecurity:
          level: restricted
          # Kyverno 1.17.2 supports version-pinned PSS checks through v1.32.
          # Native PSA namespace labels below cover the cluster's v1.35 rules.
          version: v1.32
