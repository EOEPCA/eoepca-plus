apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb-operator
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: mongodb-operator
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  project: eoepca
  source:
    repoURL: https://mongodb.github.io/helm-charts/
    chart: mongodb-kubernetes
    targetRevision: 1.7.0
    helm:
      releaseName: mongodb-kubernetes
      valuesObject:
        operator:
          env: prod
          watchNamespace: "*"
  destination:
    name: in-cluster
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
