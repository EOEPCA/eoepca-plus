resources:
  - app-pgo-core.yaml
  - postgrescluster.yaml
  - cm-initdb.yaml
  - servicemonitor-postgres-exporter.yaml

patches:
  # The operator Application must be healthy before Argo discovers or applies
  # the PostgresCluster CR in wave 10.
  - target:
      group: argoproj.io
      kind: Application
      name: ^pgo-core$
    patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: pgo-core
        annotations:
          argocd.argoproj.io/sync-wave: "-10"
  - target:
      version: v1
      kind: ConfigMap
      name: ^initdb$
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: initdb
        annotations:
          argocd.argoproj.io/sync-wave: "0"
  - target:
      group: monitoring.coreos.com
      kind: ServiceMonitor
      name: ^postgres-exporter$
    patch: |
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: postgres-exporter
        annotations:
          argocd.argoproj.io/sync-wave: "20"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
