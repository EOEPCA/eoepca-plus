apiVersion: postgres-operator.crunchydata.com/v1
kind: PostgresCluster
metadata:
  name: default
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  databaseInitSQL:
    key: initdb.sql
    name: initdb

  instances:
  - name: default
    replicas: 1
    # Sized for eo2a.3xlarge workers (16 vCPU / 64 GiB); re-derive memory params below if these change.
    resources:
      requests:
        cpu: "2"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "32Gi"
    dataVolumeClaimSpec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
      storageClassName: managed-nfs-storage-retain

  backups: {}

  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          shared_preload_libraries: pg_stat_statements, auto_explain
        pg_hba:
        - host all all 0.0.0.0/0 md5
    leaderLeaseDurationSeconds: 30
    port: 8008
    syncPeriodSeconds: 10

  config:
    parameters:
      # Peak ~96 at max STAC scale (60) + other eoAPI services (~36); alert at 80 %.
      max_connections: "100"

      shared_buffers: 8GB          # 25 % of 32 GiB pod limit
      effective_cache_size: 24GB   # planner hint: 75 % of pod limit
      work_mem: 64MB
      temp_buffers: 256MB
      maintenance_work_mem: 2GB    # × autovacuum_max_workers 3 = 6 GiB peak
      autovacuum_max_workers: "3"
      max_locks_per_transaction: "128"  # PG default (64) is too low for pgSTAC/PostGIS
      random_page_cost: "1.1"      # NFS-backed SSD

  port: 5432
  postGISVersion: "3.5"
  postgresVersion: 17

  monitoring:
    pgmonitor:
      exporter: {}

  users:
  - databases:
    - eoapi
    - postgres
    name: postgres
    options: SUPERUSER
  - databases:
    - eoapi
    - postgres
    name: eoapi
    options: CREATEDB CREATEROLE
    password:
      type: AlphaNumeric
  - databases:
    - pycsw
    - postgres
    name: pycsw
    options: CREATEDB CREATEROLE
    password:
      type: AlphaNumeric
