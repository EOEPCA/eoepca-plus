apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slurm-operator
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: slurm-operator
spec:
  # Ref. https://argo-cd.readthedocs.io/en/stable/user-guide/application-specification/
  # Sync wave is set centrally in argocd/infra/kustomization.yaml.
  project: eoepca
  source:
    repoURL: ghcr.io/slinkyproject/charts
    chart: slurm-operator
    targetRevision: "1.2.0"
    helm:
      releaseName: slurm-operator
      valuesObject:
        # cert-manager is installed at cluster bootstrap and signs the
        # operator's webhook certificate.
        certManager:
          enabled: true
  destination:
    name: in-cluster
    namespace: slinky
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
