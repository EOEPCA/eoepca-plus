apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
    security.eoepca.org/pod-security-exception-required: "true"
  annotations:
    security.eoepca.org/pod-security-exception-reason: >-
      The Trivy node collector currently requires host PID and host paths.
    security.eoepca.org/pod-security-remediation: >-
      Disable the collector during enforcement or approve a narrow, owned, time-bounded exception.
