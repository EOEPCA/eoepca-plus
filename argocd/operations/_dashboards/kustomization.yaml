apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: operations

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: manual-k8s-resources-cluster
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - k8s-resources-cluster.json
  - name: manual-k8s-resources-pod
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - k8s-resources-pod.json
