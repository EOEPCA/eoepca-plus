apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keep
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: keep
spec:
  project: eoepca
  source:
    repoURL: https://keephq.github.io/helm-charts
    chart: keep
    targetRevision: 0.1.95
    helm:
      releaseName: keep
      values: |
        backend:
          env:
          - name: AUTH_TYPE
            value: OAUTH2PROXY
          - name: KEEP_OAUTH2_PROXY_USER_HEADER
            value: x-forwarded-email
          - name: KEEP_OAUTH2_PROXY_ROLE_HEADER
            value: x-forwarded-groups
          - name: KEEP_OAUTH2_PROXY_AUTO_CREATE_USER
            value: "true"
          - name: KEEP_OAUTH2_PROXY_ADMIN_ROLES
            value: keep_admin
          - name: KEEP_OAUTH2_PROXY_NOC_ROLES
            value: keep_noc
          - name: KEEP_OAUTH2_PROXY_WEBHOOK_ROLES
            value: keep_webhook
          envFromSecret: keep-auth-secrets
          workflows:
            - id: stac_post_latency_enrichment_warning
              description: "Enrich STAC POST latency alerts with Ingress/App/DB bottleneck analysis"
              triggers:
              - type: alert
                only_on_change:
                - status
                cel: "name == 'STACPostLatencyBudgetBurn_Warning' && status == 'firing'"
              name: "STAC POST Latency Enrichment (Warning)"
              steps:
              - name: get_db_latency
                provider:
                  type: prometheus
                  config: "{{ providers.prometheus }}"
                  with:
                    query: "stac_db_mean_latency_ms"
              - name: get_gateway_latency
                provider:
                  type: prometheus
                  config: "{{ providers.prometheus }}"
                  with:
                    query: "stac_gateway_latency_500ms_burn_rate_6h"
              - name: get_app_latency
                provider:
                  type: prometheus
                  config: "{{ providers.prometheus }}"
                  with:
                    query: "stac_app_latency_500ms_burn_rate_6h"
              - name: generate_suggestion
                provider:
                  type: bash
                  with:
                    shell: true
                    command: |
                      DB_EXCEEDED='{{ steps.get_db_latency.results.data.result.0.value.1 }}'
                      APP_EXCEEDED='{{ steps.get_app_latency.results.data.result.0.value.1 }}'
                      GATEWAY_EXCEEDED='{{ steps.get_gateway_latency.results.data.result.0.value.1 }}'

                      if [ "$(echo "$DB_EXCEEDED > 250" | bc -l)" -eq 1 ]; then
                        echo "Bottleneck likely in DATABASE. Exec time is eating the GET budget."
                      elif [ "$(echo "$APP_EXCEEDED > 3" | bc -l)" -eq 1 ]; then
                        echo "Bottleneck likely in APPLICATION layer. Consider scaling eoapi-stac."
                      elif [ "$(echo "$GATEWAY_EXCEEDED > 3" | bc -l)" -eq 1 ]; then
                        echo "Bottleneck likely in APISIX GATEWAY layer."
                      else
                        echo "Degradation detected, but no single layer is strictly exceeding isolation thresholds. Check network or node health."
                      fi
              actions:
              - name: print-enrichment
                provider:
                  type: console
                  with:
                    message: |-
                      keep.uppercase({{ alert.severity }}): {{ alert.name }}

                      Diagnostic Analysis:
                      - DB Mean Latency: {{ steps.get_db_latency.results.data.result.0.value.1 }}ms
                      - Gateway Burn Rate (1h): {{ steps.get_gateway_latency.results.data.result.0.value.1 }}
                      - App Burn Rate (1h): {{ steps.get_app_latency.results.data.result.0.value.1 }}

                      Action Suggestion:
                      {{ steps.generate_suggestion.results.stdout }}

                      View Active Dashboard:
                      https://monitoring.develop.eoepca.org/d/8dfb46c7-7de5-4033-9c67-02439793bef6/apisix-endpoint-slos?var-route={{ alert.labels.route }}&from=now-6h&to=now
        frontend:
          env:
          - name: NEXTAUTH_URL
            value: https://alerting.develop.eoepca.org
          - name: NEXTAUTH_URL_INTERNAL
            value: http://keep-frontend.operations.svc.cluster.local:3000
          - name: API_URL_CLIENT
            value: /v2
          - name: API_URL
            value: http://keep-backend.operations.svc.cluster.local:8080
          - name: AUTH_TYPE
            value: OAUTH2PROXY
          - name: KEEP_OAUTH2_PROXY_USER_HEADER
            value: x-forwarded-email
          - name: KEEP_OAUTH2_PROXY_ROLE_HEADER
            value: x-forwarded-groups
        global:
          ingress:
            enabled: false
  destination:
    name: in-cluster
    namespace: operations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
