apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: keephq-route
  namespace: operations
spec:
  ingressClassName: apisix
  http:
    - name: keep-backend
      match:
        hosts:
          - alerting.rke2.deploybox.co.uk
        paths:
          - /v2/*
      backends:
        - serviceName: keep-oauth2-proxy
          servicePort: 80
      plugins:
        - name: prometheus
          enable: true
    - name: keep-websocket
      match:
        hosts:
          - alerting.rke2.deploybox.co.uk
        paths:
          - /websocket/*
      backends:
        - serviceName: keep-oauth2-proxy
          servicePort: 80
      websocket: true
    - name: keep-frontend
      match:
        hosts:
          - alerting.rke2.deploybox.co.uk
        paths:
          - /*
      backends:
        - serviceName: keep-oauth2-proxy
          servicePort: 80
