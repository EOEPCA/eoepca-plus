apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  labels:
    eoepca/is-root-app: "true"
    eoepca/app-name: loki-stack
spec:
  project: eoepca
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      values: |
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-08-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            bucketNames:
              chunks: loki
              ruler: loki
              admin: loki
            type: s3
            s3:
              endpoint: minio.develop.eoepca.org
              region: default
              accessKeyId: ${AWS_ACCESS_KEY_ID}
              secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
              s3ForcePathStyle: true
              insecure: false
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: s3
            retention_delete_delay: 2h
            compaction_interval: 10m

        singleBinary:
          replicas: 1
          extraArgs:
            - -config.expand-env=true
          extraEnvFrom:
            - secretRef:
                name: loki-s3-credentials
          extraVolumes:
            - name: loki-tmp
              emptyDir: {}
          extraVolumeMounts:
            - name: loki-tmp
              mountPath: /var/loki
          persistence:
            enabled: false

        read:
          replicas: 0

        write:
          replicas: 0

        backend:
          replicas: 0

        chunksCache:
          enabled: false

        resultsCache:
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
  destination:
    name: in-cluster
    namespace: operations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
