apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: dummy-service
spec:
  ingressClassName: apisix
  http:
  - name: dummy-service
    match:
      hosts:
        - dummy.rke2.deploybox.co.uk
      paths:
        - /*
    backends:
      - serviceName: dummy-service
        servicePort: 80
    plugins:
      # TODO: Configure client secrets through secretRef
      - name: openid-connect
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          session:
            secret: "rYh3Vgs2TpOZpotQcR1XYQ"
          access_token_in_authorization_header: true
          discovery: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/openid-configuration"
      - name: authz-keycloak
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          discovery: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/uma2-configuration"
          lazy_load_paths: true
          ssl_verify: false
  - name: dummy-service-offline
    match:
      hosts:
        - dummy-offline.rke2.deploybox.co.uk
      paths:
        - /*
    backends:
      - serviceName: dummy-service
        servicePort: 80
    plugins:
      # TODO: Configure client secrets through secretRef
      - name: openid-connect
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          session:
            secret: "rYh3Vgs2TpOZpotQcR1XYQ"
          access_token_in_authorization_header: true
          # Try to acquire offline token and pass it to backend
          scope: openid email profile offline_access
          set_refresh_token_header: true
          discovery: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/openid-configuration"
      - name: authz-keycloak
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          discovery: "https://iam-auth.rke2.deploybox.co.uk/realms/eoepca/.well-known/uma2-configuration"
          lazy_load_paths: true
          ssl_verify: false
  - name: dummy-service-open
    match:
      hosts:
        - dummy-open.rke2.deploybox.co.uk
      paths:
        - /*
    backends:
      - serviceName: dummy-service
        servicePort: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dummy-service-tls
spec:
  dnsNames:
    - dummy.develop.eoepca.org
    - dummy-offline.develop.eoepca.org
    - dummy-open.develop.eoepca.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-http01-apisix
  secretName: dummy-service-tls
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: dummy-service
spec:
  ingressClassName: apisix
  hosts:
    - dummy.develop.eoepca.org
    - dummy-offline.develop.eoepca.org
    - dummy-open.develop.eoepca.org
  secret:
    name: dummy-service-tls
    namespace: test
