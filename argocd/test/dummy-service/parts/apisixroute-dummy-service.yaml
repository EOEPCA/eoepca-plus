apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: dummy-service-route
  namespace: test
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: apisix
  http:
  - name: dummy-service
    match:
      hosts:
        - dummy.develop.eoepca.org
      paths:
        - /*
    backends:
      - serviceName: dummy-service
        servicePort: 80
    plugins:
      # TODO: Configure client secrets through secretRef
      - name: openid-connect
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          session:
            secret: "rYh3Vgs2TpOZpotQcR1XYQ"
          access_token_in_authorization_header: true
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
      - name: authz-keycloak
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/uma2-configuration"
          lazy_load_paths: true
          ssl_verify: false
  - name: dummy-service-offline
    match:
      hosts:
        - dummy-offline.develop.eoepca.org
      paths:
        - /*
    backends:
      - serviceName: dummy-service
        servicePort: 80
    plugins:
      # TODO: Configure client secrets through secretRef
      - name: openid-connect
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          session:
            secret: "rYh3Vgs2TpOZpotQcR1XYQ"
          access_token_in_authorization_header: true
          # Try to acquire offline token and pass it to backend
          scope: openid email profile offline_access
          set_refresh_token_header: true
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/openid-configuration"
      - name: authz-keycloak
        enable: true
        config:
          client_id: "demo-app"
          client_secret: "ldPg7qBvd6mrazngldUlRIQeXaEL1Dtl"
          discovery: "https://iam-auth.develop.eoepca.org/realms/eoepca/.well-known/uma2-configuration"
          lazy_load_paths: true
          ssl_verify: false
  - name: dummy-service-open
    match:
      hosts:
        - dummy-open.develop.eoepca.org
      paths:
        - /*
    backends:
      - serviceName: dummy-service
        servicePort: 80
